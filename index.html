// разбор шахматной партии силами Stockfish (если он загрузился); иначе — встроенный движок
async function runAnalysisSF(rec, onProg, onDone, alive){
  const line = rec.mv, an = [];
  setVariant(rec.variant);
  let b = rec.start ? rec.start.slice() : initBoard();
  for(let k = 0; k < line.length; k++){
    if(alive && !alive()) return;
    setVariant(rec.variant);
    const bk = !rec.start ? bookAt(line, k) : null;
    if(bk) an.push({ c:'book', b: notation(line[k]), o: bk });
    else {
      const side = k % 2 ? -1 : 1, pn = notation(line[k]);
      let list;
      try{ list = await SF.analyze(b, side, line[k]); }
      catch(e){ runAnalysis.noSF = true; runAnalysis(rec, onProg, onDone, alive); return; }   // не вышло — встроенный движок
      if(alive && !alive()) return;
      const pl = list.find(x => notation(x.m) === pn) || list[0];
      an.push(Object.assign(classify2(b, side, list, pl, an[k-1]), { sf: 1 }));
    }
    b = applyMove(b, line[k]);
    if(onProg) onProg(k + 1, line.length);
  }
  rec.an = an; if(onDone) onDone(an);
}


/* =========================================================
   13h. v15: оценка ходов «как на chess.com», дебюты у ботов, новые наборы фигур
   ========================================================= */
/* ---------- вероятность победы и точность ----------
   Оценку движка (100 = одна пешка/шашка) переводим в «шанс на победу» от 0 до 100 % по сигмоиде.
   Важна не потеря пешки сама по себе, а насколько упал шанс: при равной игре это много, при лишнем ферзе — почти ничего. */
const winPct = sc => { const cp = Math.abs(sc) > WIN - 1000 ? Math.sign(sc) * 10000 : sc; return 50 + 50 * (2 / (1 + Math.exp(-0.00368208 * cp)) - 1); };
const moveAcc = loss => Math.max(0, Math.min(100, 103.1668 * Math.exp(-0.04354 * Math.max(0, loss)) - 3.1669));
const PIECE_V = { 1:1, 2:3, 3:3, 4:5, 5:9, 6:0 };
// жертва: после хода фигура стоит под боем, и бьющий дешевле её (или её никто не защищает), а взяли мы меньше, чем отдаём
function isSacrifice(b, m){
  if(!V.chess || m.castle) return false;
  const nb = applyMove(b, m), side = Math.sign(b[m.from]), t = Math.abs(nb[m.to]), val = PIECE_V[t];
  if(val < 3) return false;
  const got = m.caps.length ? PIECE_V[Math.abs(b[m.caps[0]])] : 0;
  if(got >= val) return false;
  if(!cAttacked(nb, m.to, -side)) return false;
  const attackers = cGen(nb, -side).filter(x => x.to === m.to).map(x => PIECE_V[Math.abs(nb[x.from])] || 0);
  const cheapest = attackers.length ? Math.min(...attackers.map(v => v || 100)) : 100;
  return !cAttacked(nb, m.to, side) || cheapest < val;
}
// главная функция: ярлык хода по потере шанса на победу (Δ Win%)
function classify2(b, side, list, pl, prev){
  const best = list[0], second = list[1];
  const wBest = winPct(best.sc), wPlayed = winPct(pl.sc), loss = Math.max(0, wBest - wPlayed);
  const out = { b: notation(best.m), wb: Math.round(wBest * 10) / 10, wa: Math.round(wPlayed * 10) / 10, acc: Math.round(moveAcc(loss) * 10) / 10 };
  if(list.length === 1 || genMoves(b, side).length === 1){ out.c = 'forced'; out.acc = 100; return out; }
  const isBest = pl.m === best.m || notation(pl.m) === notation(best.m) || loss < 0.3;
  let c;
  if(loss >= 20) c = 'blunder';
  else if(loss >= 10) c = 'mistake';
  else if(loss >= 5) c = 'inacc';
  else if(isBest) c = 'best';
  else if(loss < 2) c = 'excellent';
  else c = 'good';
  // упущенный шанс: соперник только что ошибся, а мы не воспользовались
  if((c === 'mistake' || c === 'inacc' || c === 'blunder') && prev && (prev.c === 'mistake' || prev.c === 'blunder') && loss >= 8 && wPlayed >= 35) c = 'miss';
  // замечательный: единственный хороший ход в непростой позиции
  if(c === 'best' && second && wBest - winPct(second.sc) >= 15 && wBest > 25 && wBest < 93) c = 'great';
  // блестящий: лучший (или почти) ход с жертвой фигуры; до хода позиция не была выигранной, после — не проиграна
  if((c === 'best' || c === 'great' || c === 'excellent') && loss < 2 && wBest < 96 && wPlayed >= 45 && isSacrifice(b, pl.m)) c = 'brilliant';
  out.c = c;
  return out;
}
// итог партии для одной стороны: счётчики, точность (взвешенное и гармоническое среднее), «уровень игры»
function reportOf(rec, side){
  const c = { good:0, inacc:0, blunder:0, best:0, forced:0, all:0, acc:0, perf:0 };
  const accs = [], wts = [], hist = [];
  (rec.an || []).forEach((a, i) => {
    if(a.wb != null) hist.push(a.wb);
    if((i % 2 ? -1 : 1) !== side) return;
    c.all++;
    if(['brilliant','great','best','excellent','good','book'].includes(a.c)) c.good++;
    if(['brilliant','great','best'].includes(a.c)) c.best++;
    if(a.c === 'inacc' || a.c === 'mistake') c.inacc++;
    if(a.c === 'blunder' || a.c === 'miss') c.blunder++;
    if(a.c === 'forced') c.forced++;
    if(a.c === 'book'){ accs.push(100); wts.push(1); return; }
    if(a.acc != null){
      // вес хода — насколько «острой» была позиция (разброс шансов в последних ходах)
      const win = hist.slice(-4), mean = win.reduce((s, v) => s + v, 0) / (win.length || 1);
      const sd = Math.sqrt(win.reduce((s, v) => s + (v - mean) ** 2, 0) / (win.length || 1));
      accs.push(a.acc); wts.push(Math.max(.5, Math.min(12, sd)));
    }
  });
  if(accs.length){
    const wMean = accs.reduce((s, v, i) => s + v * wts[i], 0) / wts.reduce((s, v) => s + v, 0);
    const hMean = accs.length / accs.reduce((s, v) => s + 1 / Math.max(v, 1), 0);
    c.acc = Math.round((wMean + hMean) / 2);
  } else c.acc = c.all ? Math.round((c.good + c.forced) / c.all * 100) : 0;
  c.perf = Math.round((Math.max(300, Math.min(2900, 400 + 0.24 * c.acc * c.acc))) / 25) * 25;   // очень примерная оценка уровня
  return c;
}

/* ---------- дебюты у ботов: даже слабые боты первые ходы играют «по книге» ---------- */
function botBookMove(){
  if(!V.chess || game.start) return null;
  const done = game.mvs.map(notation), pre = done.join(' ');
  if(done.length >= 10) return null;
  const next = new Set();
  for(const [line] of BOOK){
    const mv = line.split(' ');
    if(mv.length > done.length && mv.slice(0, done.length).join(' ') === pre) next.add(mv[done.length]);
  }
  if(!next.size) return null;
  const pick = [...next][Math.floor(Math.random() * next.size)];
  return genMoves(game.board, game.turn).find(x => notation(x) === pick) || null;
}

async function tryJoinLink(){
  let code = null; try{ code = sessionStorage.getItem('pendingLink'); }catch(e){}
  if(!code || !db.current) return;
  try{ sessionStorage.removeItem('pendingLink'); }catch(e){}
  if(liveOnline()){ toast('Сначала закончи онлайн-партию'); return; }
  toast('Ищем партию по ссылке…');
  for(let i = 0; i < 24; i++){
    const st = lobby ? lobby.presenceState() : {};
    for(const [k, metas] of Object.entries(st)){
      const meta = metas.find(x => x.lk && x.lk.c === code); if(!meta) continue;
      if(k === db.current){ toast('Это твоя же ссылка — отправь её другу'); return; }
      netSend(k, 'link_join', { code, ...meCard(meta.lk.v, meta.lk.t) });
      return;
    }
    await new Promise(r => setTimeout(r, 500));
  }
  modal(`<div class="big-ico">${PIX('chat')}</div><h2>Партия не найдена</h2><p class="muted">Создатель ссылки сейчас не на сайте или уже начал другую партию. Попроси его прислать новую ссылку.</p>`, [{ label:'Понятно' }]);
}

function ratedGames(u, variant, tc){ return (u.history || []).filter(g => (g.variant || '32') === variant && (!tc || g.tc === tc) && !g.friend && !g.unrated && g.rating); }
function sparkSVG(pts, W, H, labels){
  W = W || 320; H = H || 110;
  if(!pts.length) pts = [1000, 1000]; if(pts.length === 1) pts = [pts[0], pts[0]];
  let lo = Math.min(...pts), hi = Math.max(...pts); if(hi - lo < 30){ lo -= 15; hi += 15; }
  const P = 8, x = i => P + i * (W - 2 * P) / (pts.length - 1), y = v => P + (hi - v) * (H - 2 * P) / (hi - lo);
  const line = pts.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const grid = [1, 2, 3].map(k => `<line x1="0" x2="${W}" y1="${(H * k / 4).toFixed(1)}" y2="${(H * k / 4).toFixed(1)}" class="sp-grid"/>`).join('');
  const lab = labels ? [0, .5, 1].map(f => { const v = Math.round(hi - (hi - lo) * f); return `<text x="${W - 2}" y="${Math.max(10, Math.min(H - 3, y(v) - 3))}" text-anchor="end" class="sp-lab">${v}</text>`; }).join('') : '';
  const dots = pts.length <= 14 ? pts.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3" class="sp-dot"/>`).join('') : '';
  return `<svg viewBox="0 0 ${W} ${H}" class="spark" preserveAspectRatio="none"><defs><linearGradient id="spg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--gold)" stop-opacity=".38"/><stop offset="1" stop-color="var(--gold)" stop-opacity="0"/></linearGradient></defs>
    ${grid}<polygon points="${x(0)},${H} ${line} ${x(pts.length - 1)},${H}" fill="url(#spg)"/><polyline points="${line}" fill="none" stroke="var(--gold)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>${dots}
    <circle cx="${x(pts.length - 1)}" cy="${y(pts[pts.length - 1])}" r="4.5" class="sp-end"/>${lab}</svg>`;
}

const LB = { start: null, moves: [], sel: null, edit: false, tool: 6, flip: false, name: '' };
function lbReset(start, name){ LB.start = (start || cInit()).slice(); LB.moves = []; LB.sel = null; LB.name = name || ''; }
function lbBoard(upto){ return withChess(() => { let b = LB.start.slice(); LB.moves.slice(0, upto == null ? LB.moves.length : upto).forEach(m => b = applyMove(b, m)); return b; }); }
const lbTurn = () => LB.moves.length % 2 ? -1 : 1;
const isInitial = b => withChess(() => cInit().slice(0, 64).join() === b.slice(0, 64).join());
function lbSan(){ return withChess(() => { let b = LB.start.slice(), out = []; LB.moves.forEach((m, k) => { out.push((k % 2 ? '' : (k / 2 + 1) + '. ') + cSan(b, m)); b = applyMove(b, m); }); return out.join(' '); }); }
function lbHTML(id){
  if(!LB.start) lbReset();
  const b = lbBoard(), turn = lbTurn(), last = LB.moves[LB.moves.length - 1];
  const legal = LB.edit || LB.sel == null ? [] : withChess(() => genMoves(b, turn).filter(m => m.from === LB.sel));
  const cells = [];
  for(let y = 0; y < 8; y++) for(let x = 0; x < 8; x++){
    const r = LB.flip ? 7 - y : y, c = LB.flip ? 7 - x : x, s = r * 8 + c, v = b[s];
    const cls = ['sq', (r + c) % 2 ? 'dark' : 'light'];
    if(last && (s === last.from || s === last.to)) cls.push('lb-last');
    if(s === LB.sel) cls.push('lb-sel');
    const tgt = legal.some(m => m.to === s);
    cells.push(`<div class="${cls.join(' ')}" data-s="${s}">${v ? withChess(() => pieceMini(v)) : ''}${tgt ? `<i class="${v ? 'lb-cap' : 'lb-dot'}"></i>` : ''}${x === 0 ? `<em class="lb-rk">${8 - r}</em>` : ''}${y === 7 ? `<em class="lb-fl">${'abcdefgh'[c]}</em>` : ''}</div>`);
  }
  const pal = [6, 5, 4, 3, 2, 1].map(t => [t, -t]).flat();
  return `<div class="lb-wrap" id="${id}">
    <div class="lb-top"><span class="lb-ttl">${PIX('board')} ${LB.edit ? 'Редактор позиции' : (LB.name ? esc(LB.name) : 'Свободная доска')}</span>
      <button class="link" data-lb="edit">${LB.edit ? `${ICON.check} Готово` : 'Редактор позиции ↗'}</button></div>
    ${LB.edit ? `<div class="lb-pal">${pal.map(t => `<button class="${LB.tool === t ? 'on' : ''}" data-tool="${t}">${withChess(() => pieceMini(t))}</button>`).join('')}<button class="lb-er ${LB.tool === 0 ? 'on' : ''}" data-tool="0" title="Стереть">✕</button></div>` : ''}
    <div class="mini-board lb bt-${db.settings.cBoardTheme || 'classic'} pt-${db.settings.cPieceTheme || 'cartoon'}" style="--mc:8">${cells.join('')}</div>
    <div class="lb-info">${LB.edit ? '<span class="muted small">Выбери фигуру сверху и нажимай на клетки. Первыми ходят белые.</span>'
      : `<span class="lb-turn"><i class="${turn > 0 ? 'w' : 'b'}"></i>Ход ${turn > 0 ? 'белых' : 'чёрных'}</span><span class="lb-moves" translate="no">${LB.moves.length ? lbSan() : '<span class="muted">Сделай ход на доске или выбери позицию</span>'}</span>`}</div>
    <div class="lb-btns">
      ${LB.edit ? `<button class="btn sm" data-lb="clear">Очистить</button><button class="btn sm" data-lb="init">Начальная</button><button class="btn sm" data-lb="flip">⇄</button>`
        : `<button class="btn sm" data-lb="init">↺ Начальная позиция</button><button class="btn sm" data-lb="back" ${LB.moves.length ? '' : 'disabled'}>◀ Ход назад</button><button class="btn sm" data-lb="flip" title="Перевернуть доску">⇄</button>`}
    </div>
    ${LB.edit ? '' : `<div class="lb-btns two"><button class="btn sm primary" data-lb="play">${ICON.playFill} Играть с этой позиции</button><button class="btn sm" data-lb="analyze">${PIX('search')} Анализировать</button></div>`}
  </div>`;
}
function bindLB(id, rerender){
  const box = document.getElementById(id); if(!box) return;
  const draw = () => { const w = document.getElementById(id); w.outerHTML = lbHTML(id); bindLB(id, rerender); };
  box.querySelectorAll('.lb .sq').forEach(el => el.onclick = () => {
    const s = +el.dataset.s;
    if(LB.edit){
      const b = LB.start.slice();
      if(Math.abs(LB.tool) === 6) for(let i = 0; i < 64; i++) if(b[i] === LB.tool) b[i] = 0;          // король только один
      if(Math.abs(LB.tool) === 1 && (s < 8 || s >= 56)){ toast('Пешка не может стоять на первой и последней горизонтали'); return; }
      b[s] = b[s] === LB.tool ? 0 : LB.tool; LB.start = b; draw(); return;
    }
    const b = lbBoard(), turn = lbTurn();
    if(LB.sel != null){
      const mv = withChess(() => genMoves(b, turn).filter(m => m.from === LB.sel && m.to === s));
      if(mv.length){ const m = mv.find(x => !x.promote || x.promote === 5) || mv[0]; LB.moves.push(m); LB.sel = null; playMoveSound(m); draw(); return; }
    }
    LB.sel = b[s] * turn > 0 && LB.sel !== s ? s : null; draw();
  });
  box.querySelectorAll('[data-tool]').forEach(t => t.onclick = () => { LB.tool = +t.dataset.tool; draw(); });
  box.querySelectorAll('[data-lb]').forEach(t => t.onclick = () => {
    const a = t.dataset.lb;
    if(a === 'flip'){ LB.flip = !LB.flip; draw(); }
    if(a === 'init'){ lbReset(); draw(); }
    if(a === 'back'){ LB.moves.pop(); LB.sel = null; draw(); }
    if(a === 'clear'){ LB.start = new Array(69).fill(0); LB.start[67] = 7; draw(); }
    if(a === 'edit'){
      if(!LB.edit){ LB.start = lbBoard(); LB.moves = []; LB.sel = null; LB.edit = true; LB.name = ''; draw(); return; }
      const err = lbCheck(LB.start); if(err){ toast(err); return; }
      if(!isInitial(LB.start)) LB.start[64] = 0; else LB.start = cInit();
      LB.edit = false; draw();
    }
    if(a === 'play') playFromLB();
    if(a === 'analyze') analyzeLB();
  });
}
function lbCheck(b){
  const n = v => b.slice(0, 64).filter(x => x === v).length;
  if(n(6) !== 1 || n(-6) !== 1) return 'Нужно ровно по одному королю каждого цвета';
  if(withChess(() => cInCheck(b, -1))) return 'Чёрный король под шахом, а ходят белые — так не бывает';
  if(!withChess(() => genMoves(b, 1).length)) return 'У белых нет ходов в этой позиции';
  return '';
}
// партия с позиции живой доски: стартуем с её начала и «проигрываем» сделанные ходы — так работает и разбор
function launchFrom(start, moves, o){
  launchGame(o); if(!game || game.review) return;
  const custom = !isInitial(start);
  if(custom){ game.start = start.slice(); game.board = start.slice(); }
  for(const m of moves){
    const san = cSan(game.board, m);
    game.board = applyMove(game.board, m);
    game.moves.push(san);
    game.mvs.push({ from:m.from, path:m.path, caps:m.caps, to:m.to, promote:m.promote, castle:m.castle, rf:m.rf, kt:m.kt, rt:m.rt, ep:m.ep, dbl:m.dbl, san });
    game.last = m; game.ply++; game.turn = -game.turn;
  }
  game.reps = new Map(); countRep();
  game.botToken++; game.thinking = false;
  renderAll();
  if(game.bot && game.turn !== game.me) scheduleBot();
}
function playFromLB(){
  if(playBlocked()) return;
  const m = db.menu, mode = m.opp === 'friend' ? 'friend' : 'bot';
  if(m.opp === 'online') toast('С позиции можно играть с ботом или с другом рядом');
  const color = m.color === 'random' ? (Math.random() < .5 ? 'white' : 'black') : m.color;
  launchFrom(LB.start, LB.moves, { variant:'chess', tc: m.tc, inc: m.inc, color, friend: mode === 'friend', bot: mode === 'friend' ? null : CHESS_BOTS[m.cbot || 0],
    undo: true, friendName: (m.friendName || '').trim() || 'Друг', friendFlip: !!m.friendFlip });
}
function analyzeLB(){
  if(!LB.moves.length && isInitial(LB.start)){ toast('Сначала сделай пару ходов или расставь позицию'); return; }
  const rec = { date: Date.now(), variant:'chess', friend: true, opp: tr('Анализ'), color: 'white', tc:'0', inc:0, result:'draw', reason:'agreement',
    moves: LB.moves.length, rating: 0, delta: 0, mv: [], imported: true };
  if(!isInitial(LB.start)) rec.start = LB.start.slice();
  withChess(() => { let b = LB.start.slice(); LB.moves.forEach(m => { rec.mv.push(Object.assign({}, m, { san: cSan(b, m) })); b = applyMove(b, m); }); });
  openReview(0, null, rec);
}

function resumeGet(){ return LS.get(userKey('resume'), null); }
function resumeSet(o){ LS.set(userKey('resume'), Object.assign({ t: Date.now() }, o)); }
function resumeHTML(){
  const items = [];
  if(game && !game.over && !game.review && !game.puzzle) items.push({ ic:'swords', t:'Партия ещё идёт', s:`${tr('против')} ${esc(oppName())}`, act:'game', b:'Вернуться к партии' });
  const r = resumeGet();
  if(r && Date.now() - r.t < 7 * 864e5){

}
function bindResume(box){
  box.querySelectorAll('[data-rs]').forEach(b => b.onclick = () => {
    const a = b.dataset.rs, r = resumeGet();
    if(a === 'game') go('game');

    if(a === 'train'){ chessTab = 'train'; trainView = null; renderChessClub(); }
  });
}

/* ---------- ежедневная тренировка: 5 заданий ---------- */
function trainMarks(){ const k = userKey('train_' + dayKey(Date.now())); return { k, v: LS.get(k, {}) }; }
function trainMark(id){ const t = trainMarks(); t.v[id] = 1; LS.set(t.k, t.v); }
function trainPlan(){
  const t = trainMarks().v, today = dayKey(Date.now()), u = me();
  const hist = (u && u.history || []).filter(g => dayKey(g.date) === today);
  const p = withChess(() => { const keep = db.menu.variant; if(!isChessMenu()) db.menu.variant = 'chess'; const pz = todayPuzzle(), d = !!puzStore().done[pz.day]; db.menu.variant = keep; return d; });
  const list = [
    { id:'daily', ic:'target', t:'Реши задачу дня', ok: p },
    { id:'tactic', ic:'hint', t:'Реши 3 задачи по тактике', ok: (t.tactic || 0) >= 3, n: Math.min(3, t.tactic || 0) + '/3' },
    { id:'bot', ic:'bot', t:'Сыграй партию с ботом', ok: hist.some(g => (VARIANTS[g.variant] || {}).chess && !g.friend && !g.online) },
    { id:'open', ic:'book2', t:'Изучи один дебют', ok: !!t.open },
    { id:'review', ic:'search', t:'Разбери свою партию', ok: !!t.review }
  ];
  return { list, done: list.filter(x => x.ok).length };
}
// подсчёт решённых задач по темам
if(typeof themedEnd === 'function'){ const _te = themedEnd; themedEnd = function(result, reason){ if(result === 'win' && game && !game.over){ const t = trainMarks(); t.v.tactic = (t.v.tactic || 0) + 1; LS.set(t.k, t.v); } return _te.apply(this, arguments); }; }
// разбор своей партии — запоминаем, где остановились
{ const _or = openReview; openReview = function(i, ownerKey, recIn){ _or.apply(this, arguments);
    if(game && game.review && !recIn && (!ownerKey || ownerKey === db.current) && (VARIANTS[game.variant] || {}).chess){ trainMark('review'); resumeSet({ type:'review', date: game.rec.date, pos: 0 }); } }; }
{ const _sp = setPos; setPos = function(i){ _sp.apply(this, arguments); const r = resumeGet(); if(game && game.review && r && r.type === 'review' && game.rec && r.date === game.rec.date){ r.pos = game.rv.pos; LS.set(userKey('resume'), r); } }; }

/* ---------- свободная доска: перетаскивание мышкой, стрелки правой кнопкой, редактор ---------- */
LB.arrows = []; LB.circles = [];
function lbArrowsSVG(){
  const c = s => { let r = s >> 3, f = s & 7; if(LB.flip){ r = 7 - r; f = 7 - f; } return [f * 100 + 50, r * 100 + 50]; };
  const ar = LB.arrows.map(([a, b]) => {
    const [x1, y1] = c(a), [x2, y2] = c(b), dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
    const ex = x2 - ux * 34, ey = y2 - uy * 34, px = -uy, py = ux;
    return `<line x1="${x1}" y1="${y1}" x2="${ex}" y2="${ey}" stroke="rgba(255,170,0,.85)" stroke-width="17" stroke-linecap="round"/>
      <polygon points="${x2 - ux * 6},${y2 - uy * 6} ${ex + px * 26},${ey + py * 26} ${ex - px * 26},${ey - py * 26}" fill="rgba(255,170,0,.85)"/>`;
  }).join('');
  const ci = LB.circles.map(s => { const [x, y] = c(s); return `<circle cx="${x}" cy="${y}" r="44" fill="none" stroke="rgba(255,170,0,.85)" stroke-width="8"/>`; }).join('');
  return `<svg class="lb-arrows" viewBox="0 0 800 800">${ar}${ci}</svg>`;
}
function lbHTML(id){

    const cls = ['sq', (r + c) % 2 ? 'dark' : 'light'];
    if(last && (s === last.from || s === last.to)) cls.push('lb-last');
    if(s === LB.sel) cls.push('lb-sel');
    const tgt = legal.some(m => m.to === s);
    cells.push(`<div class="${cls.join(' ')}" data-s="${s}">${v ? withChess(() => pieceMini(v)) : ''}${tgt ? `<i class="${v ? 'lb-cap' : 'lb-dot'}"></i>` : ''}${x === 0 ? `<em class="lb-rk">${8 - r}</em>` : ''}${y === 7 ? `<em class="lb-fl">${'abcdefgh'[c]}</em>` : ''}</div>`);
  }
  const pal = [6, 5, 4, 3, 2, 1].map(t => [t, -t]).flat();
  return `<div class="lb-wrap" id="${id}">
    <div class="lb-top"><span class="lb-ttl">${PIX('board')} ${LB.edit ? 'Редактор позиции' : (LB.name ? esc(LB.name) : 'Свободная доска')}</span>
      <button class="link" data-lb="edit">${LB.edit ? `${ICON.check} Готово` : 'Редактор позиции ↗'}</button></div>
    ${LB.edit ? `<div class="lb-pal pt-${th}">${pal.map(t => `<button class="${LB.tool === t ? 'on' : ''}" data-tool="${t}" title="Нажми, чтобы выбрать, или перетащи на доску">${withChess(() => pieceMini(t))}</button>`).join('')}<button class="lb-er ${LB.tool === 0 ? 'on' : ''}" data-tool="0" title="Стереть">✕</button></div>` : ''}
    <div class="mini-board lb bt-${db.settings.cBoardTheme || 'classic'} pt-${th}" style="--mc:8">${cells.join('')}${lbArrowsSVG()}</div>
    <div class="lb-info">${LB.edit ? '<span class="muted small">Перетаскивай фигуры из ряда сверху на доску, а лишние — за край доски. Можно и кликами. Первыми ходят белые.</span>'
      : `<span class="lb-turn"><i class="${turn > 0 ? 'w' : 'b'}"></i>Ход ${turn > 0 ? 'белых' : 'чёрных'}</span><span class="lb-moves" translate="no">${LB.moves.length ? lbSan() : '<span class="muted">Перетащи фигуру мышкой или нажми на неё. Правая кнопка — стрелки</span>'}</span>`}</div>
    <div class="lb-btns">
      ${LB.edit ? `<button class="btn sm" data-lb="clear">Очистить</button><button class="btn sm" data-lb="init">Начальная</button><button class="btn sm" data-lb="flip">⇄</button>`
        : `<button class="btn sm" data-lb="init">↺ Начальная позиция</button><button class="btn sm" data-lb="back" ${LB.moves.length ? '' : 'disabled'}>◀ Ход назад</button><button class="btn sm" data-lb="flip" title="Перевернуть доску">⇄</button>`}
    </div>
    ${LB.edit ? '' : `<div class="lb-btns two"><button class="btn sm primary" data-lb="play">${ICON.playFill} Играть с этой позиции</button><button class="btn sm" data-lb="analyze">${PIX('search')} Анализировать</button></div>`}
  </div>`;

let LBD = null, LBR = null;              // LBD — тащим фигуру, LBR — рисуем стрелку правой кнопкой
const lbRedraw = id => { const w = document.getElementById(id); if(!w) return; w.outerHTML = lbHTML(id); bindLB(id, lbRedraw.cb[id]); };
lbRedraw.cb = {};
function lbPlace(s, v){
  const b = LB.start.slice();
  if(Math.abs(v) === 6) for(let i = 0; i < 64; i++) if(b[i] === v) b[i] = 0;
  if(Math.abs(v) === 1 && (s < 8 || s >= 56)){ toast('Пешка не может стоять на первой и последней горизонтали'); return false; }
  b[s] = v; LB.start = b; return true;
}
function bindLB(id, rerender){
  const box = document.getElementById(id); if(!box) return;
  lbRedraw.cb[id] = rerender;
  const draw = () => lbRedraw(id);
  const board = box.querySelector('.lb');
  board.addEventListener('contextmenu', e => e.preventDefault());
  box.querySelectorAll('.lb .sq').forEach(el => {
    el.onpointerdown = e => {
      const s = +el.dataset.s;
      if(e.button === 2){ LBR = { id, s }; return; }
      if(e.button !== 0) return;
      if(LB.arrows.length || LB.circles.length){ LB.arrows = []; LB.circles = []; const svg = box.querySelector('.lb-arrows'); if(svg) svg.innerHTML = ''; }
      const b = LB.edit ? LB.start : lbBoard(), v = b[s];
      if(!v || (!LB.edit && v * lbTurn() <= 0)) return;
      e.preventDefault();
      LBD = { id, from: s, v, x0: e.clientX, y0: e.clientY, moved: false };
    };
    el.onclick = () => {
      if(Date.now() - (LB.skipClick || 0) < 250) return;
      const s = +el.dataset.s;
      if(LB.edit){ const b = LB.start.slice(); if(b[s] === LB.tool){ b[s] = 0; LB.start = b; } else if(LB.tool === 0){ b[s] = 0; LB.start = b; } else lbPlace(s, LB.tool); draw(); return; }
      const b = lbBoard(), turn = lbTurn();
      if(LB.sel != null && lbTry(LB.sel, s)){ draw(); return; }
      LB.sel = b[s] * turn > 0 && LB.sel !== s ? s : null; draw();
    };
  });
  box.querySelectorAll('[data-tool]').forEach(t => {
    t.onclick = () => { if(Date.now() - (LB.skipClick || 0) < 250) return; LB.tool = +t.dataset.tool; draw(); };
    t.onpointerdown = e => { const v = +t.dataset.tool; if(e.button !== 0 || !v) return; e.preventDefault(); LBD = { id, from: null, v, x0: e.clientX, y0: e.clientY, moved: false }; };
  });
  box.querySelectorAll('[data-lb]').forEach(t => t.onclick = () => {
    const a = t.dataset.lb;
    LB.arrows = []; LB.circles = [];
    if(a === 'flip'){ LB.flip = !LB.flip; draw(); }
    if(a === 'init'){ lbReset(); draw(); }
    if(a === 'back'){ LB.moves.pop(); LB.sel = null; draw(); }
    if(a === 'clear'){ LB.start = new Array(69).fill(0); LB.start[67] = 7; draw(); }
    if(a === 'edit'){
      if(!LB.edit){ LB.start = lbBoard(); LB.moves = []; LB.sel = null; LB.edit = true; LB.name = ''; draw(); return; }
      const err = lbCheck(LB.start); if(err){ toast(err); return; }
      if(!isInitial(LB.start)) LB.start[64] = 0; else LB.start = cInit();
      LB.edit = false; draw();
    }
    if(a === 'play') playFromLB();
    if(a === 'analyze') analyzeLB();
  });
}
function lbTry(from, to){
  const b = lbBoard(), mv = withChess(() => genMoves(b, lbTurn()).filter(m => m.from === from && m.to === to));
  if(!mv.length) return false;
  const m = mv.find(x => !x.promote || x.promote === 5) || mv[0];
  LB.moves.push(m); LB.sel = null; playMoveSound(m);
  const r = lbRedraw.cb; if(typeof study !== 'undefined' && study && trainView === 'study' && LB.moves.every((x, j) => study.mv[j] && notation(study.mv[j]) === notation(x))){ study.k = LB.moves.length; resumeSet({ type:'open', i: study.i, k: study.k }); if(study.k >= study.mv.length) trainMark('open'); setTimeout(renderTrain, 0); }
  return true;
}
const lbSqAt = (id, x, y) => { const el = document.elementFromPoint(x, y); const sq = el && el.closest(`#${id} .lb .sq`); return sq ? +sq.dataset.s : null; };
window.addEventListener('pointermove', e => {
  if(!LBD) return;
  if(!LBD.moved){
    if(Math.hypot(e.clientX - LBD.x0, e.clientY - LBD.y0) < 5) return;
    LBD.moved = true;
    const box = document.getElementById(LBD.id); if(!box){ LBD = null; return; }
    const sz = box.querySelector('.lb .sq').getBoundingClientRect().width;
    if(!LB.edit && LBD.from != null){ LB.sel = LBD.from; lbRedraw(LBD.id); }
    const g = document.createElement('div');
    g.className = `lb-ghost pt-${cpTheme()}`; g.style.width = g.style.height = sz + 'px';
    g.innerHTML = withChess(() => pieceMini(LBD.v));
    document.body.append(g); LBD.ghost = g;
    if(LBD.from != null){ const src = document.querySelector(`#${LBD.id} .lb .sq[data-s="${LBD.from}"] .pcw`); if(src) src.style.opacity = '.25'; }
  }
  const g = LBD.ghost, w = parseFloat(g.style.width);
  g.style.left = (e.clientX - w / 2) + 'px'; g.style.top = (e.clientY - w / 2) + 'px';
});
window.addEventListener('pointerup', e => {
  if(LBR && e.button === 2){
    const t = lbSqAt(LBR.id, e.clientX, e.clientY), a = LBR.s, id = LBR.id; LBR = null;
    if(t == null) return;
    if(t === a){ const i = LB.circles.indexOf(a); i >= 0 ? LB.circles.splice(i, 1) : LB.circles.push(a); }
    else { const i = LB.arrows.findIndex(([x, y]) => x === a && y === t); i >= 0 ? LB.arrows.splice(i, 1) : LB.arrows.push([a, t]); }
    const svg = document.querySelector(`#${id} .lb-arrows`); if(svg) svg.outerHTML = lbArrowsSVG();
    return;
  }
  if(!LBD) return;
  const d = LBD; LBD = null;
  if(!d.moved) return;
  d.ghost && d.ghost.remove();
  LB.skipClick = Date.now();
  const t = lbSqAt(d.id, e.clientX, e.clientY);
  if(LB.edit){
    if(d.from != null && d.from === t){ lbRedraw(d.id); return; }
    const keep = LB.start.slice();
    if(d.from != null){ const b = LB.start.slice(); b[d.from] = 0; LB.start = b; }      // унесли за край доски — фигура удалена
    if(t != null && !lbPlace(t, d.v)) LB.start = keep;
    lbRedraw(d.id); return;
  }
  if(t != null && t !== d.from) lbTry(d.from, t);
  lbRedraw(d.id);
});

/* =========================================================
   13m. v20: ОЦЕНКА ХОДОВ ПО МЕТОДИЧКЕ (модель Lichess + расширенные категории)
   1) Оценка Stockfish (сантипешки, за белых) → шанс на победу W(cp) = 100 / (1 + e^(−0.00368208·cp)).
   2) Потеря хода L = max(0, W_лучший − W_сыгранный), обе оценки — за того, кто ходил.
   3) Категории: Лучший (совпал с движком), Превосходный 0–2, Хороший 2–5, Неточность 5–10, Ошибка 10–15, Зевок 15+ п.п.
   4) Точность хода = 103.1668·e^(−0.04354·L) − 3.1669 (0…100). Партия: среднее взвешенного (по «остроте» позиции) и гармонического.
   5) Вынужденные ходы в точность не входят. Мат считается отдельно (как 100 % / 0 %). ACPL — средняя потеря, оценки обрезаны до ±1000.
   ========================================================= */
const AN_DEPTHS = { fast: 14, std: 18, deep: 22 }, AN_CAP = { 14: 5000, 18: 14000, 22: 35000 };
const anDepth = () => AN_DEPTHS[db.settings.anDepth] || 14;
const W_ = sc => winPct(sc);                                  // шанс на победу (0…100) для оценки «за ходящего»
const cpClamp = sc => Math.abs(sc) > WIN - 1000 ? Math.sign(sc) * 1000 : Math.max(-1000, Math.min(1000, sc));
Object.assign(MC.excellent, { tip:'Потеря 0–2 % шанса на победу' });
Object.assign(MC.good, { tip:'Потеря 2–5 % шанса на победу' });
Object.assign(MC.inacc, { tip:'Потеря 5–10 % шанса на победу' });
Object.assign(MC.mistake, { tip:'Потеря 10–15 % шанса на победу' });
Object.assign(MC.blunder, { tip:'Потеря 15 % шанса на победу и больше' });
Object.assign(MC.best, { tip:'Совпадает с лучшим ходом движка' });

// одна позиция: до 3 лучших ходов (MultiPV 3) с оценкой за того, кто ходит
async function sfPosition(b, side, D){
  const ms = genMoves(b, side);
  if(!ms.length) return { lines: [], ev: cInCheck(b, side) ? -WIN : 0, n: 0 };
  const r = await SF.search(b, side, `go depth ${D} movetime ${AN_CAP[D] || 5000}`, Math.min(3, ms.length));
  const lines = [];
  for(const [u, sc] of r.lines){ const m = sfFind(ms, u); if(m && !lines.some(x => x.m === m)) lines.push({ m, sc }); }
  if(!lines.length) lines.push({ m: sfFind(ms, r.best) || ms[0], sc: 0 });
  return { lines, ev: lines[0].sc, n: ms.length };
}
// классификация одного хода
function classifyV2(o){
  const { loss, isBest, forced, wb, wa, second, prev, sac } = o;
  if(forced) return 'forced';
  let c = isBest ? 'best' : loss < 2 ? 'excellent' : loss < 5 ? 'good' : loss < 10 ? 'inacc' : loss < 15 ? 'mistake' : 'blunder';
  // упущенный шанс: соперник только что ошибся, у нас был заметный перевес — и мы его упустили
  if(['inacc', 'mistake', 'blunder'].includes(c) && prev && ['mistake', 'blunder', 'miss'].includes(prev.c) && wb >= 60 && loss >= 8) c = 'miss';
  // замечательный: единственный хороший ход (второй по силе заметно хуже) в непростой позиции
  if(c === 'best' && second != null && wb - W_(second) >= 15 && wb > 20 && wb < 95) c = 'great';
  // блестящий: лучший или почти лучший ход с жертвой фигуры; после жертвы позиция не плохая;
  // до хода перевес не был подавляющим, и без этого хода подавляющего перевеса тоже не было бы
  if(['best', 'great', 'excellent'].includes(c) && loss < 2 && sac && wa >= 50 && wb < 97 && (second == null || W_(second) < 85)) c = 'brilliant';
  return c;
}
async function runAnalysisSF(rec, onProg, onDone, alive){
  const line = rec.mv, n = line.length, D = anDepth();
  setVariant(rec.variant);
  const boards = [rec.start ? rec.start.slice() : initBoard()];
  for(let k = 0; k < n; k++) boards.push(applyMove(boards[k], line[k]));
  const books = line.map((m, k) => !rec.start ? bookAt(line, k) : null);
  const P = [];
  for(let i = 0; i <= n; i++){
    if(alive && !alive()) return;
    setVariant(rec.variant);
    const side = i % 2 ? -1 : 1;
    // позиции внутри дебютной теории считаем быстрее — для них нужна только оценка для «остроты» партии
    const d = i < n && books[i] && (i === 0 || books[i - 1]) ? Math.min(10, D) : D;
    try{ P[i] = await sfPosition(boards[i], side, d); }
    catch(e){ runAnalysis.noSF = true; runAnalysis(rec, onProg, onDone, alive); return; }
    if(onProg) onProg(Math.min(i, n), n);
  }
  if(alive && !alive()) return;
  setVariant(rec.variant);
  const an = [];
  for(let k = 0; k < n; k++){
    const side = k % 2 ? -1 : 1, pn = notation(line[k]), p = P[k];
    const best = p.lines[0], second = p.lines[1], inLines = p.lines.find(x => notation(x.m) === pn);
    const isBest = notation(best.m) === pn;
    const evBest = best.sc, evPlayed = isBest ? best.sc : inLines ? inLines.sc : -P[k + 1].ev;
    const wb = W_(evBest), wa = W_(evPlayed), loss = isBest ? 0 : Math.max(0, wb - wa);
    const forced = p.n === 1;
    const a = { b: notation(best.m), bs: cSan(boards[k], best.m, true), wb: Math.round(wb * 10) / 10, wa: Math.round(wa * 10) / 10,
      w: Math.round(W_(p.ev * side) * 10) / 10, cpl: forced ? 0 : Math.max(0, cpClamp(evBest) - cpClamp(evPlayed)), sf: 1 };
    if(books[k]){ a.c = 'book'; a.o = books[k]; a.acc = 100; }
    else {
      a.c = classifyV2({ loss, isBest, forced, wb, wa, second: second ? second.sc : null, prev: an[k - 1], sac: isSacrifice(boards[k], line[k]) });
      a.acc = forced ? null : Math.round(moveAcc(loss) * 10) / 10;
    }
    an.push(a);
  }
  rec.an = an; rec.anV = 2; rec.anD = D;
  if(onDone) onDone(an);
}
// итог партии для одной стороны (точность как у Lichess: взвешенное по волатильности + гармоническое среднее)
function reportOf(rec, side){
  const c = { good:0, inacc:0, blunder:0, best:0, forced:0, all:0, acc:0, perf:0, acpl:0 };
  const an = rec.an || [], n = an.length;
  const ws = an.map(a => a.w != null ? a.w : 50);
  const win = Math.max(2, Math.min(8, Math.round(n / 10)));
  const sd = xs => { const m = xs.reduce((s, v) => s + v, 0) / xs.length; return Math.sqrt(xs.reduce((s, v) => s + (v - m) ** 2, 0) / xs.length); };
  const accs = [], wts = []; let cplSum = 0, cplN = 0;
  an.forEach((a, i) => {
    if((i % 2 ? -1 : 1) !== side) return;
    c.all++;
    if(['brilliant', 'great', 'best', 'excellent', 'good', 'book'].includes(a.c)) c.good++;
    if(['brilliant', 'great', 'best'].includes(a.c)) c.best++;
    if(a.c === 'inacc' || a.c === 'mistake') c.inacc++;
    if(a.c === 'blunder' || a.c === 'miss') c.blunder++;
    if(a.c === 'forced'){ c.forced++; return; }                 // вынужденные ходы точность не завышают
    if(a.c !== 'book' && a.cpl != null){ cplSum += a.cpl; cplN++; }
    if(a.acc == null) return;
    const st = Math.max(0, Math.min(i - win + 2, n - win)), wnd = ws.slice(st, st + win);
    accs.push(a.acc); wts.push(Math.max(.5, Math.min(12, wnd.length > 1 ? sd(wnd) : .5)));
  });
  if(accs.length){
    const wMean = accs.reduce((s, v, i) => s + v * wts[i], 0) / wts.reduce((s, v) => s + v, 0);
    const hMean = accs.length / accs.reduce((s, v) => s + 1 / Math.max(v, 1), 0);
    c.acc = Math.round((wMean + hMean) / 2 * 10) / 10;
  } else c.acc = c.all ? Math.round((c.good + c.forced) / c.all * 100) : 0;
  c.acpl = cplN ? Math.round(cplSum / cplN) : 0;
  c.perf = Math.round((Math.max(300, Math.min(2900, 400 + 0.24 * c.acc * c.acc))) / 25) * 25;
  return c;
}
