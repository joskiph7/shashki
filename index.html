/* ---------- вход и регистрация (Supabase Auth: почта + пароль, ник в профиле) ---------- */
const AUTH_ERR = {
  'Invalid login credentials': 'Неверная почта или пароль',
  'User already registered': 'Эта почта уже зарегистрирована',
  'Email not confirmed': 'Почта не подтверждена — открой письмо от Supabase',
  'Unable to validate email address: invalid format': 'Почта указана с ошибкой'
};
const authErr = m => AUTH_ERR[m] || (/rate limit/i.test(m) ? 'Слишком много попыток, подожди минуту' : /Password should/i.test(m) ? 'Пароль — минимум 6 символов' : m);
function showAuth(tab){
  tab = tab || 'login';
  const reg = tab === 'reg';
  $('#modalRoot').innerHTML = `<div class="overlay"><div class="modal">
    <img class="auth-logo" src="${CHECKER_IMG}" alt=""><h2>Шашки и Шахматы</h2>
    ${(() => { try{ return sessionStorage.getItem('pendingLink'); }catch(e){ return null; } })() ? '<p class="auth-inv">Тебя пригласили на партию! Войди или создай аккаунт — и игра сразу начнётся.</p>' : ''}
    <div class="tabs"><button data-t="login" class="${!reg?'on':''}">Вход</button><button data-t="reg" class="${reg?'on':''}">Регистрация</button></div>
    <form id="authForm">
      ${reg ? '<input id="aNick" maxlength="16" placeholder="Никнейм (виден другим)" autocomplete="nickname">' : ''}
      <input id="aMail" type="email" placeholder="Почта" autocomplete="email">
      <input id="aPass" type="password" placeholder="Пароль" autocomplete="${reg ? 'new-password' : 'current-password'}">
      ${reg ? '<input id="aPass2" type="password" placeholder="Повтори пароль" autocomplete="new-password">' : ''}
      <label class="show-pass"><input type="checkbox" id="aShow"> показать пароль</label>
      <div class="err" id="aErr"></div>
      <button class="btn primary big" type="submit" id="aGo">${reg ? 'Создать аккаунт' : 'Войти'}</button>
    </form>
    ${sb ? '' : '<p class="err">Нет связи с сервером. Проверь интернет и обнови страницу.</p>'}
  </div></div>`;
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => showAuth(b.dataset.t));
  $('#aShow').onchange = e => document.querySelectorAll('#aPass,#aPass2').forEach(i => i.type = e.target.checked ? 'text' : 'password');
  setTimeout(() => { const f = $('#aNick') || $('#aMail'); if(f) f.focus(); }, 30);
  $('#authForm').onsubmit = async e => {
    e.preventDefault();
    if(!sb) return;
    const err = t => { $('#aErr').textContent = t; };
    const mail = $('#aMail').value.trim(), pass = $('#aPass').value, btn = $('#aGo');
    if(!mail || !pass) return err('Введи почту и пароль');
    btn.disabled = true; err('');
    try{
      if(reg){
        const nick = $('#aNick').value.trim();
        if(nick.length < 2) return err('Ник — минимум 2 символа');
        if(pass.length < 6) return err('Пароль — минимум 6 символов');
        if(pass !== $('#aPass2').value) return err('Пароли не совпадают');
        const { data: same } = await sb.from('profiles').select('id').ilike('nick', nick.replace(/[\\%_]/g, '\\$&')).limit(1);
        if(same && same.length) return err('Такой ник уже занят');
        const { data, error } = await sb.auth.signUp({ email: mail, password: pass, options: { data: { nick } } });
        if(error) return err(authErr(error.message));
        if(!data.session) return err('Аккаунт создан. Подтверди почту по ссылке из письма и войди.');
        await afterLogin(data.session.user, true);
      } else {
        const { data, error } = await sb.auth.signInWithPassword({ email: mail, password: pass });
        if(error) return err(authErr(error.message));
        await afterLogin(data.user);
      }
    } finally { if(document.body.contains(btn)) btn.disabled = false; }
  };
}
// после входа: профиль, история, друзья, «кто в сети»
async function afterLogin(user, fresh){
  db.current = user.id;
  await fetchProfiles();
  let row = await fetchProfile(user.id);
  if(!row){                                   // профиль ещё не создался — создаём сами
    const nick = (user.user_metadata && user.user_metadata.nick) || ('Игрок' + String(Date.now()).slice(-4));
    await sb.from('profiles').insert({ id: user.id, nick });
    row = await fetchProfile(user.id) || { nick, ratings:{}, created_at: new Date().toISOString() };
  }
  db.accounts[user.id] = rowToAcc(row, null);
  if(isBanned(me())){ showBan(me()); return; }
  updateAdminNav();
  const hist = await fetchHistory(user.id);
  if(db.current !== user.id || !me()) return;        // пока грузились — вышли или заблокировали
  me().history = hist;
  me().gamesN = hist.length;
  lastSync = JSON.stringify(profData(me()));
  await fetchSocial();
  joinLobby(); watchProfiles();
  closeModal(); renderMeMini(); go('home', true);
  setTimeout(popFriendReqs, 600);
  setTimeout(tryJoinLink, 900);
  toast(fresh ? `Добро пожаловать, ${me().nick}!` : `Привет, ${me().nick}!`);
}
async function boot(){
  if(!sb){ showAuth(); return; }
  $('#modalRoot').innerHTML = `<div class="overlay"><div class="modal"><div class="search-anim"><span></span><span></span><span></span></div><h2>Подключаемся…</h2></div></div>`;
  const { data } = await sb.auth.getSession();
  if(data && data.session) await afterLogin(data.session.user);
  else showAuth();
}
async function logout(force){
  if(pending && !force){ askPending(logout); return; }
  if(pending) hideSaveBar();
  if(game && !game.over && !game.review){ resignOnline(); endGame('loss', 'resign', true); }
  stopSearch(true);
  leaveLobby();
  game = null; clearInterval(timer);
  db.current = null; db.accounts = {}; socialCache = { friends:[], requests:[] };
  if(profWatch && sb){ sb.removeChannel(profWatch); profWatch = null; }
  updateAdminNav();
  renderMeMini();
  document.querySelectorAll('.screen').forEach(s => s.hidden = s.id !== 'scr-home');
  if(sb) await sb.auth.signOut();
  showAuth('login');
}

  setVariant(variant);
  const b = initBoard(), cells = [];
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const v = b[idx(r,c)];
    cells.push(`<div class="sq ${isDark(r,c) ? 'dark' : 'light'}">${v ? pieceMini(v) : ''}</div>`);
  }
  return `<div class="mini-board bt-${bth()} pt-${pth()}" style="--mc:${COLS}">${cells.join('')}</div>`;
}

  const u = me(), m = db.menu;
  const all = u.history.filter(g => (g.variant || '32') === m.variant);
  const c = countRes(all), rt = rating(m.variant, m.tc);
  const lastR = u.history.find(g => (g.variant || '32') === m.variant && g.tc === m.tc && !g.friend && !g.unrated);
  const trend = lastR ? (lastR.delta > 0 ? '<i class="up">↑</i>' : lastR.delta < 0 ? '<i class="down">↓</i>' : '') : '';
  const last = u.history[0];
  const lastHTML = last ? `
      <div class="qs-last">
        <div class="qs-row"><span class="ava round sm">${avatarHTML(u.avatar)}</span><span>Вы</span><b>${last.result === 'win' ? 1 : last.result === 'draw' ? '½' : 0}</b></div>

/* =========================================================
   8b. ДРУЗЬЯ, ПРИСУТСТВИЕ, СООБЩЕНИЯ ИГРОКАМ (Supabase Realtime)
   Всё идёт через сервер Supabase: таблица friendships и канал «lobby».
   ========================================================= */
const TAB_ID = Math.random().toString(36).slice(2);
const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);

/* ---------- «лобби»: один общий канал Supabase Realtime ----------
   Presence — кто в сети и что делает (онлайн / ищет игру / в партии).
   Broadcast — короткие сообщения игрокам: вызовы, ходы, ничья, сдача. */
let lobby = null, lastTrack = '';
const STATUS_TXT = { online:'Онлайн', playing:'В игре', searching:'Ищет игру', offline:'Оффлайн' };
function myStatus(){ return game && game.online && !game.over && !game.review ? 'playing' : search ? 'searching' : 'online'; }
function joinLobby(){
  if(!sb || !db.current) return;
  leaveLobby();
  lastTrack = '';
  lobby = sb.channel('lobby', { config: { presence: { key: db.current }, broadcast: { self: false } } });
  lobby
    .on('presence', { event: 'sync' }, () => {
      refreshPresence();
      // кто-то новый в сети, а его профиля у нас нет — подгрузим
      if(Object.keys(lobby.presenceState()).some(k => !db.accounts[k])) fetchProfiles().then(onSocialChange);
    })
    .on('broadcast', { event: 'msg' }, ({ payload }) => {
      const msg = payload;
      if(!msg || !db.current || msg.to !== db.current || msg.tab === TAB_ID) return;
      const h = netHandlers[msg.type]; if(h) h(msg);
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'friendships' }, () => fetchSocial().then(onSocialChange))
    .subscribe(st => { if(st === 'SUBSCRIBED') heartbeat(true); });
}
function leaveLobby(){ if(lobby && sb){ try{ lobby.untrack(); }catch(e){} sb.removeChannel(lobby); } lobby = null; }
// сообщаем серверу свой статус (только если он поменялся)
function heartbeat(force){
  if(!lobby || !db.current) return;
  const meta = { s: myStatus(), q: search ? { variant: search.variant, tc: search.tc, inc: search.inc, joined: search.joined } : null,
    lk: typeof linkGame !== 'undefined' && linkGame ? { c: linkGame.code, v: linkGame.variant, t: linkGame.tc } : null };
  const js = JSON.stringify(meta);
  if(force || js !== lastTrack){ lastTrack = js; lobby.track(meta); }
  checkOppAlive();
}
function presenceRemove(){ if(lobby){ try{ lobby.untrack(); }catch(e){} lastTrack = ''; } }
function statusOf(key){
  if(key === db.current) return myStatus();
  if(!lobby) return 'offline';
  const metas = lobby.presenceState()[key];
  if(!metas || !metas.length) return 'offline';
  const ss = metas.map(m => m.s);
  return ss.includes('playing') ? 'playing' : ss.includes('searching') ? 'searching' : 'online';
}
setInterval(() => heartbeat(), 3000);
setInterval(refreshPresence, 5000);
setInterval(() => { if(db.current && sb) fetchProfiles().then(() => { if(current === 'home'){ renderTopCard(); renderFriendsCard(); } }); }, 60000);

/* ---------- друзья и заявки (таблица friendships) ---------- */
let socialCache = { friends:[], requests:[] };
async function fetchSocial(){
  if(!sb || !db.current) return;
  const { data, error } = await sb.from('friendships').select('requester,addressee,status,created_at');
  if(error) return;
  socialCache = {
    friends: data.filter(r => r.status === 'accepted').map(r => [r.requester, r.addressee]),
    requests: data.filter(r => r.status === 'pending').map(r => ({ from: r.requester, to: r.addressee, t: Date.parse(r.created_at) }))
  };
  if(data.some(r => !db.accounts[r.requester] || !db.accounts[r.addressee])) await fetchProfiles();
}
const socialGet = () => socialCache;
const friendsOf = k => socialGet().friends.filter(p => p.includes(k)).map(p => p[0] === k ? p[1] : p[0]).filter(x => db.accounts[x]);
function relation(k){
  const s = socialGet(), m = db.current;
  if(s.friends.some(p => p.includes(m) && p.includes(k))) return 'friend';
  if(s.requests.some(r => r.from === m && r.to === k)) return 'sent';
  if(s.requests.some(r => r.from === k && r.to === m)) return 'incoming';
  return 'none';
}
const incomingReq = () => socialGet().requests.filter(r => r.to === db.current && db.accounts[r.from]);
async function socialDo(promise, okText){
  const { error } = await promise;
  if(error){ toast('Не получилось: ' + error.message); return; }
  if(okText) toast(okText);
  await fetchSocial(); onSocialChange();
}
function sendFriendRequest(k){
  if(relation(k) === 'incoming'){ acceptFriend(k); return; }
  socialCache.requests.push({ from: db.current, to: k, t: Date.now() });      // сразу видно на экране
  socialDo(sb.from('friendships').insert({ requester: db.current, addressee: k }), 'Заявка в друзья отправлена')
    .then(() => netSend(k, 'social'));
}
function acceptFriend(k){
  socialDo(sb.from('friendships').update({ status: 'accepted' }).eq('requester', k).eq('addressee', db.current),
    `${db.accounts[k] ? db.accounts[k].nick : 'Игрок'} теперь твой друг`).then(() => netSend(k, 'social'));
  sb.from('friendships').delete().eq('requester', db.current).eq('addressee', k).eq('status', 'pending').then(() => {});   // встречная заявка больше не нужна
}
function declineFriend(k){ socialDo(sb.from('friendships').delete().eq('requester', k).eq('addressee', db.current)); }
function cancelRequest(k){ socialDo(sb.from('friendships').delete().eq('requester', db.current).eq('addressee', k)).then(() => netSend(k, 'social')); }
function removeFriend(k){
  modal(`<h2>Удалить из друзей?</h2><p class="muted">${esc(db.accounts[k].nick)} пропадёт из списка друзей.</p>`, [
    { label:'Отмена' },
    { label:'Удалить', cls:'danger', onClick: () => socialDo(sb.from('friendships').delete()
        .or(`and(requester.eq.${db.current},addressee.eq.${k}),and(requester.eq.${k},addressee.eq.${db.current})`)).then(() => netSend(k, 'social')) }
  ]);
}
// что-то поменялось в друзьях/профилях — обновляем экран
function onSocialChange(){
  if(!db.current || !me()) return;
  renderBell(); popFriendReqs();
  if(current === 'home'){ renderFriendsCard(); renderTopCard(); }

  if(current === 'profile' && !editingAbout && !editingNick && !pending) renderProfile();
}

/* ---------- сообщения игрокам ---------- */
const netHandlers = {};
function netSend(to, type, data){
  if(!lobby) return;
  lobby.send({ type: 'broadcast', event: 'msg', payload: { id: uid(), to, from: db.current, tab: TAB_ID, type, data: data || {}, t: Date.now() } });
}
netHandlers.social = () => fetchSocial().then(onSocialChange);

/* ---------- поиск случайного соперника ---------- */
let search = null;
function startSearch(){
  if(playBlocked()) return;
  if(liveOnline()){ toast('Сначала закончи онлайн-партию'); go('game'); return; }
  if(!lobby){ toast('Нет связи с сервером'); return; }
  const m = db.menu;
  stopSearch(true);
  search = { variant: m.variant, tc: m.tc, inc: tcById(m.tc).sec ? (+m.inc || 0) : 0, joined: Date.now(), offer: null };
  modal(`<div class="search-anim"><span></span><span></span><span></span></div><h2>Ищем соперника</h2>
    <p class="muted">${VAR_NAMES[search.variant]} · ${tcLabel(search.tc, search.inc)}</p><p class="big-timer" id="srchTime">0:00</p>`,
    [{ label:'Отменить поиск', onClick: () => stopSearch() }]);
  heartbeat();
  searchTick();
  search.timer = setInterval(searchTick, 1000);
}
function stopSearch(silent){
  if(!search) return;
  clearInterval(search.timer);
  search = null; heartbeat();
  if(!silent) toast('Поиск отменён');
}
function searchTick(){
  if(!search || !lobby) return;
  const s = search, now = Date.now();
  const el = $('#srchTime'); if(el){ const sec = Math.floor((now - s.joined)/1000); el.textContent = `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`; }
  if(s.offer && now - s.offer.t > 5000) s.offer = null;          // предложение без ответа — ищем дальше
  // кто ещё ищет игру с теми же настройками
  const st = lobby.presenceState();
  let other = null;
  for(const [key, metas] of Object.entries(st)){
    if(key === db.current) continue;
    const q = metas.map(m => m.q).find(q => q && q.variant === s.variant && q.tc === s.tc && q.inc === s.inc);
    if(q){ other = { key, joined: q.joined }; break; }
  }
  // партию начинает тот, кто пришёл в поиск позже
  if(other && !s.offer && (other.joined < s.joined || (other.joined === s.joined && other.key < db.current))){
    const myColor = Math.random() < .5 ? 'white' : 'black';
    s.offer = { gid: uid(), to: other.key, color: myColor, t: now, seed: Math.floor(Math.random() * 960) };
    netSend(other.key, 'match', { gid: s.offer.gid, seed: s.offer.seed, variant: s.variant, tc: s.tc, inc: s.inc, color: myColor === 'white' ? 'black' : 'white', ...meCard(s.variant, s.tc) });
  }
}
const meCard = (variant, tc) => ({ nick: me().nick, avatar: me().avatar, rating: rating(variant, tc) });
netHandlers.match = msg => {
  const d = msg.data, s = search;
  if(!s || s.offer || d.variant !== s.variant || d.tc !== s.tc || d.inc !== s.inc) return;
  netSend(msg.from, 'match_ok', { gid: d.gid, ...meCard(d.variant, d.tc) });
  stopSearch(true);
  startOnlineGame({ gid: d.gid, oppKey: msg.from, opp: d, color: d.color, variant: d.variant, tc: d.tc, inc: d.inc, seed: d.seed });
};
netHandlers.match_ok = msg => {
  const s = search; if(!s || !s.offer || s.offer.gid !== msg.data.gid) return;
  const o = s.offer;
  stopSearch(true);
  startOnlineGame({ gid: o.gid, oppKey: msg.from, opp: msg.data, color: o.color, variant: s.variant, tc: s.tc, inc: s.inc, seed: o.seed });
};

/* ---------- приглашения на партию ---------- */
let invites = [];          // входящие: { iid, from, nick, variant, tc, inc, t }
let sentInvite = null;     // исходящее
function askInvite(k){
  if(playBlocked()) return;
  const st = statusOf(k);
  if(st === 'offline'){ toast('Игрок не в сети'); return; }
  if(st === 'playing'){ toast('Игрок сейчас в партии'); return; }
  const a = db.accounts[k], m = db.menu;

const POP_MAX = 4;

function popPush(p){

function popPump(){
  const box = $('#popStack');

    const p = popQueue.shift();
    const el = document.createElement('div');
    el.className = 'pop'; el.id = 'pop-' + p.id; if(p.from) el.dataset.from = p.from;
    el.innerHTML = `<button class="pop-x" title="Закрыть">${ICON.x}</button>
      <span class="ava round">${p.ava}</span>

      ${p.ttl ? `<i class="pop-timer" style="animation-duration:${p.ttl}ms"></i>` : ''}`;
    el.querySelector('.pop-x').onclick = () => popClose(p.id);
    el.querySelector('.pop-ok').onclick = () => { popClose(p.id); p.ok(); };
    el.querySelector('.pop-no').onclick = () => { popClose(p.id); p.no(); };

    friendName: (m.friendName || '').trim() || 'Друг', friendFlip: !!m.friendFlip });
}

function launchGame(o){

    bot: o.bot || null, online: o.online || null, board: initBoard(), turn: 1, me: o.color === 'white' ? 1 : -1,
    tc, inc: tc.sec ? (+o.inc || 0) : 0, clocks: { 1: tc.sec*1000, '-1': tc.sec*1000 },
    moves: [], mvs: [], last: null, over: false, premoves: [], sel: null, step: 0, stepPath: [], cands: null,
    arrows: [], circles: [], hint: null, ply: 0, lastCapPly: 0, drawAskPly: -99, botOffer: false, botOfferPly: -99,

function countRep(){ const k = posKey(), n = (game.reps.get(k) || 0) + 1; game.reps.set(k, n); return n; }

function tick(){

function takenDots(side){
  if(V.chess){
    const init = { 1:8, 2:2, 3:2, 4:2, 5:1 }, cnt = {}, G = side === 1 ? { 5:'♛', 4:'♜', 3:'♝', 2:'♞', 1:'♟' } : { 5:'♕', 4:'♖', 3:'♗', 2:'♘', 1:'♙' };
    for(let i = 0; i < 64; i++){ const v = game.board[i]; if(v * side < 0) cnt[Math.abs(v)] = (cnt[Math.abs(v)] || 0) + 1; }
    let h = '', mine = 0, theirs = 0; const VAL = { 1:1, 2:3, 3:3, 4:5, 5:9 }, own = {};
    for(let i = 0; i < 64; i++){ const v = game.board[i]; if(v * side > 0) own[Math.abs(v)] = (own[Math.abs(v)] || 0) + 1; }
    for(const t of [5, 4, 3, 2, 1]){ h += G[t].repeat(Math.max(0, init[t] - (cnt[t] || 0))); mine += Math.max(0, init[t] - (cnt[t] || 0)) * VAL[t]; theirs += Math.max(0, init[t] - (own[t] || 0)) * VAL[t]; }
    const adv = mine - theirs;              // перевес по материалу: пешка 1, конь и слон 3, ладья 5, ферзь 9
    return `<div class="taken chess-taken">${h}${adv > 0 ? `<em class="adv">+${adv}</em>` : ''}</div>`;
  }
  if(game.puzzle) return '<div class="taken"></div>';      // в задаче шашек изначально меньше — счёт не нужен
  const left = game.board.filter(v => v*side < 0).length;
  const col = side === 1 ? '#111' : '#eee';
  const myLeft = game.board.filter(v => v*side > 0).length, adv = myLeft - left;     // на сколько шашек больше
  return `<div class="taken">${`<i style="background:${col}"></i>`.repeat(Math.max(0, V.per - left))}${adv > 0 ? `<em class="adv">+${adv}</em>` : ''}</div>`;
}

}

    const badge = side === game.me ? adminBadge(game.ownerKey || db.current) : (pk ? adminBadge(pk) : '');
    // v9: плашка собрана из трёх частей, и меняется только то, что поменялось —
    // аватарка не перерисовывается каждый ход (на телефоне это давало мигание)
    const el = $(box);
    if(!el._parts){
      el.innerHTML = '<span class="pb-ava"></span><div class="nm"></div><div class="pb-right"></div>';
      el._parts = el.children;
    }
    const [pa, pn, pr] = el._parts;
    setHTML(pa, `<span class="ava${pk ? ' to-prof' : ''}"${pk ? ` data-prof="${esc(pk)}" title="Открыть профиль"` : ''}>${i.ava}</span>`);
    setHTML(pn, `<span class="nm-line"><span${lk}>${i.name}</span>${badge}</span><small>${i.sub}</small>${takenDots(side)}`);
    setHTML(pr, right);
    el.querySelectorAll('[data-prof]').forEach(x => x.onclick = () => openPlayer(x.dataset.prof, true));
    const pc = el.querySelector('#pmCancel'); if(pc) pc.onclick = cancelPremoves;
  }
  renderClocks();
}
// записать HTML, только если он изменился (меньше перерисовок — меньше мигания)
function setHTML(el, html){ if(el._h !== html){ el.innerHTML = html; el._h = html; } }
// плашка «Вернуться к партии», когда во время онлайн-партии ушёл на другую страницу
function updateGameBanner(){
  const el = $('#gameBanner'); if(!el) return;
  const on = !!(game && game.online && !game.over && !game.review && current !== 'game');
  el.hidden = !on;
  if(!on) return;
  const mine = game.turn === game.me;
  el.classList.toggle('my-turn', mine);
  el.innerHTML = `<span class="gb-dot"></span><span>Партия с <b>${esc(game.online.nick)}</b> · ${mine ? 'твой ход' : 'ход соперника'}${game.tc.sec ? ' · ' + fmtClock(game.clocks[game.me]) : ''}</span><b class="gb-go">Вернуться ${ICON.arrow}</b>`;
}

/* ---------- премувы (цепочка ходов заранее) ---------- */
function virtualBoard(){      // доска «как будто» премувы уже сделаны
  const vb = game.board.slice();
  if(V.chess){ for(const p of game.premoves) cVirtualMove(vb, p.from, p.to); return vb; }
  for(const p of game.premoves){
    const v = vb[p.from]; if(!v) continue;
    vb[p.from] = 0;
    vb[p.to] = (Math.abs(v) === 1 && rowOf(p.to) === promoRow(Math.sign(v))) ? 2*Math.sign(v) : v;
  }
  return vb;
}
function pseudoTargets(s, vb){
  if(V.chess) return cPseudoTargets(s, vb);
  const v = vb[s], r = rowOf(s), c = colOf(s), res = [];
  if(!v) return res;
  for(let r2=0;r2<ROWS;r2++) for(let c2=0;c2<COLS;c2++){
    if(!isDark(r2,c2) || (r2 === r && c2 === c)) continue;
    const dr = r2 - r, dc = c2 - c;
    if(Math.abs(v) === 2){ res.push(idx(r2,c2)); continue; }                 // дамка: любая тёмная клетка
    if(dr === fwd(Math.sign(v)) && Math.abs(dc) === 1) res.push(idx(r2,c2));  // простой ход
    else if(dr % 2 === 0 && dc % 2 === 0) res.push(idx(r2,c2));             // возможное взятие (в т.ч. серия)
  }
  return res;
}
const premoveMode = () => game.sel != null && !game.cands;
function currentTargets(){
  if(game.sel == null) return [];
  if(game.cands){
    const set = new Set();
    for(const m of game.cands){ if(m.path.length > game.step) set.add(m.path[game.step]); set.add(m.to); }
    return [...set];
  }
  return pseudoTargets(game.sel, virtualBoard());
}

function renderSquares(){
  const tg = new Set(currentTargets());
  const pm = premoveMode();
  const last = game.last;
  const chk = V.chess && !game.review && cInCheck(game.board, game.turn) ? cKing(game.board, game.turn) : -1;   // король под шахом
  const preNum = new Map(); game.premoves.forEach((p,i) => preNum.set(p.to, i+1));
  const preSq = new Set(); game.premoves.forEach(p => { preSq.add(p.from); preSq.add(p.to); });
  for(let s=0;s<N;s++){
    const el = game.sqEls[s];
    el.className = 'sq ' + (isDark(rowOf(s), colOf(s)) ? 'dark' : 'light');
    el.innerHTML = '';
    if(last && (s === last.from || last.path.includes(s))) el.classList.add('hl-last');
    if(game.sel === s) el.classList.add(pm ? 'hl-presel' : 'hl-sel');
    if(game.stepPath.includes(s)) el.classList.add('hl-path');
    if(tg.has(s) && (db.settings.hints || pm)){ el.classList.add('dot'); if(pm) el.classList.add('pre'); }
    if(s === chk) el.classList.add('hl-check');
    if(preSq.has(s)) el.classList.add('hl-pre');
  }
}

function placeEl(el, s){ const { x, y } = disp(s); el.style.left = (x*100/COLS) + '%'; el.style.top = y*12.5 + '%'; }
function renderPieces(){
  const box = $('#pieces');
  let must = new Set();
  if(myTurn() && game.sel == null){
    const ms = legalMine();
    if(!V.chess && ms.length && ms[0].caps.length) must = new Set(ms.map(m => m.from));
  }
  // v9: шашки, которые стоят на месте, не пересоздаются (раньше вся доска перерисовывалась каждый ход)
  const old = new Map();
  box.querySelectorAll('.piece').forEach(el => {
    if(drag && drag.moved && drag.el === el && el.classList.contains('dragging') && !el.classList.contains('captured')) old.set(+el.dataset.sq, el);
    else if(el.classList.contains('dragging') || el.classList.contains('moving') || el.classList.contains('captured')) el.remove();
    else old.set(+el.dataset.sq, el);
  });
  box.querySelectorAll('.mc-badge').forEach(el => el.remove());
  const PB = (!game.review && !game.over && game.premoves.length) ? virtualBoard() : game.board;   // с премувами — «как будто уже сходили»
  for(let s=0;s<N;s++){
    const v = PB[s];
    let el = old.get(s); old.delete(s);
    if(!v){ if(el) el.remove(); continue; }
    const cls = 'piece ' + (v > 0 ? 'w' : 'b') + (V.chess ? ' chess' : (Math.abs(v) === 2 ? ' k' : '')) + (must.has(s) ? ' must' : '');
    if(!el){ el = document.createElement('div'); el.dataset.sq = s; box.appendChild(el); }
    const held = !!(drag && drag.moved && drag.el === el && (v > 0) === el.classList.contains('w'));
    if(!held && drag && drag.el === el && drag.moved) drag = null;        // поднятую фигуру взяли — отпускаем
    const cls2 = held ? cls + ' dragging' : cls;
    if(el.className !== cls2) el.className = cls2;
    if(!held) placeEl(el, s);
    setHTML(el, V.chess ? `<div class="cp t${Math.abs(v)}">${cpSVG(Math.abs(v))}</div>` : `<div class="disc">${Math.abs(v) === 2 ? CROWN : ''}</div>`);
  }
  old.forEach(el => el.remove());
  // значок оценки хода на клетке, куда пришла шашка
  if(game.review && game.rec.an && game.rv.pos > 0 && lineMatches(game.rv.pos)){
    const a = game.rec.an[game.rv.pos-1], m = game.rv.line[game.rv.pos-1];
    if(a){
      const { x, y } = disp(m.to);
      const b = document.createElement('div'); b.className = 'mc-badge';
      b.style.left = `calc(${(x+1)*100/COLS}% - 18px)`; b.style.top = `calc(${y*12.5}% - 8px)`;
      b.innerHTML = mcIcon(a.c, 26); box.appendChild(b);
    }
  }
}

function arrowSVG(a, b, color){
  const ctr = s => { const { x, y } = disp(s); return [x*100+50, y*100+50]; };
  const [x1,y1] = ctr(a), [x2,y2] = ctr(b);
  const dx = x2-x1, dy = y2-y1, L = Math.hypot(dx,dy), ux = dx/L, uy = dy/L, nx = -uy, ny = ux;
  const w = 9, hw = 24, hl = Math.min(40, L*.5);
  const bx = x2 - ux*hl, by = y2 - uy*hl;
  const p = [[x1+nx*w,y1+ny*w],[bx+nx*w,by+ny*w],[bx+nx*hw,by+ny*hw],[x2,y2],[bx-nx*hw,by-ny*hw],[bx-nx*w,by-ny*w],[x1-nx*w,y1-ny*w]];
  return `<polygon points="${p.map(q => q.map(n => n.toFixed(1)).join(',')).join(' ')}" fill="${color}"/>`;
}
function renderAnnot(){
  let out = '';
  for(const s of game.circles){ const { x, y } = disp(s); out += `<circle cx="${x*100+50}" cy="${y*100+50}" r="44" fill="none" stroke="rgba(25,125,35,.8)" stroke-width="7"/>`; }
  for(const [a,b] of game.arrows) out += arrowSVG(a, b, 'rgba(30,130,40,.72)');
  if(game.hint){ let a = game.hint.from; for(const t of game.hint.path){ out += arrowSVG(a, t, 'rgba(40,110,225,.78)'); a = t; } }
  $('#annot').innerHTML = out;
}

function renderStatus(){
  const st = $('#status');
  st.classList.remove('cap');
  if(game.review){
    const rv = game.rv, noMoves = !genMoves(game.board, game.turn).length;
    st.textContent = `Разбор · ход ${rv.pos} из ${rv.line.length} · ` + (noMoves ? 'ходов больше нет' : `ходят ${game.turn === 1 ? 'белые' : 'чёрные'}`) + (isVaried() ? ' · свой вариант' : '');
    return;
  }
  if(game.over){ st.textContent = game.resultText || 'Партия окончена'; return; }
  if(game.turn === mySide()){
    const ms = legalMine();
    const who = game.friend ? `Ходит ${esc(nameOf(game.turn))} (${game.turn === 1 ? 'белые' : 'чёрные'})` : 'Твой ход';
    if(V.chess && cInCheck(game.board, game.turn)){ st.innerHTML = PIX('bolt') + ' ' + who + ' — шах!'; st.classList.add('cap'); }
    else if(!V.chess && ms.length && ms[0].caps.length){ st.textContent = who + ' — бить обязательно!'; st.classList.add('cap'); }
    else st.textContent = who;
  } else {
    st.textContent = (game.online ? `Ходит ${game.online.nick}…` : `${game.bot.name} думает…`) + (game.premoves.length ? `  (премувы: ${game.premoves.map(p => sqName(p.from)+'-'+sqName(p.to)).join(', ')})` : '');
  }
}

function renderMoves(){
  const box = $('#moveList'), rows = [];
  if(game.review){
    const rv = game.rv, an = game.rec.an;
    const cell = k => {
      const m = rv.line[k]; if(!m) return '<span></span>';
      const isVar = !rv.orig[k] || notation(rv.orig[k]) !== notation(m);
      const ic = (!isVar && an && an[k]) ? mcIcon(an[k].c, 15) : '';
      return `<span class="mv ${k+1 === rv.pos ? 'cur' : ''} ${isVar ? 'var' : ''}" data-i="${k+1}">${ic}${m.san || notation(m)}</span>`;
    };
    for(let k=0;k<rv.line.length;k+=2) rows.push(`<div class="row"><span class="n">${k/2+1}.</span>${cell(k)}${cell(k+1)}</div>`);
    box.innerHTML = rows.join('') || '<span class="muted">В этой партии нет ходов.</span>';
    box.querySelectorAll('.mv').forEach(el => el.onclick = () => setPos(+el.dataset.i));
    // прокручиваем только список ходов (scrollIntoView дёргал всю страницу)
    const cur = box.querySelector('.mv.cur');
    if(cur){
      const r = cur.getBoundingClientRect(), br = box.getBoundingClientRect();
      if(r.top < br.top) box.scrollTop -= br.top - r.top + 6;
      else if(r.bottom > br.bottom) box.scrollTop += r.bottom - br.bottom + 6;
    }
    return;
  }
  for(let i=0;i<game.moves.length;i+=2) rows.push(`<div class="row"><span class="n">${i/2+1}.</span><span>${game.moves[i]}</span><span>${game.moves[i+1] || ''}</span></div>`);
  box.innerHTML = rows.join('') || '<span class="muted">Ходов пока нет. Белые начинают.</span>';
  box.scrollTop = box.scrollHeight;
}

function renderOffer(){
  const box = $('#offerBox');
  if((game.botOffer || game.netDrawOffer) && !game.over && !game.review){
    box.innerHTML = `<div class="offer">${esc(oppName())} предлагает ничью<div class="actions"><button class="btn primary" id="offYes">Принять</button><button class="btn" id="offNo">Отклонить</button></div></div>`;
    $('#offYes').onclick = () => {
      if(game.online) netSend(game.online.key, 'draw_accept', { gid: game.online.gid });
      endGame('draw','agreement');
    };
    $('#offNo').onclick = () => {
      if(game.online) netSend(game.online.key, 'draw_decline', { gid: game.online.gid });
      game.botOffer = false; game.netDrawOffer = false; renderOffer();
    };
  } else box.innerHTML = '';
  $('#btnDraw').disabled = game.over;
  $('#btnResign').disabled = game.over;
}

/* ---------- выбор и выполнение хода ---------- */
function clearSel(){ game.sel = null; game.cands = null; game.step = 0; game.stepPath = []; }
function selectSq(s){
  clearSel();
  game.sel = s;
  game.cands = myTurn() ? legalMine().filter(m => m.from === s) : null;
  if(game.cands && !game.cands.length){
    const all = legalMine();
    if(!V.chess && all.length && all[0].caps.length) toast('Взятие обязательно — бей другой шашкой');
  }
  renderSquares(); renderPieces();
}
function samePath(ms){ return new Set(ms.map(m => m.path.join(','))).size === 1; }
function tryTarget(s){
  // если пока выбирали премув, ход уже перешёл к нам — превращаем выбор в обычный ход
  if(!game.cands && myTurn()) game.cands = legalMine().filter(m => m.from === game.sel);
  if(game.cands){
    let ms = game.cands.filter(m => m.path[game.step] === s);
    if(ms.length){
      if(samePath(ms)){ pickPromo(ms, commit); return true; }
      game.step++; game.stepPath.push(s); game.cands = ms;
      renderSquares(); return true;
    }
    ms = game.cands.filter(m => m.to === s);
    if(ms.length){
      if(samePath(ms)){ pickPromo(ms, commit); return true; }
      toast('Сюда можно прийти разными путями — кликай по шагам');
      return true;
    }
    return false;
  }
  if(pseudoTargets(game.sel, virtualBoard()).includes(s)){
    if(game.premoves.length >= 10){ toast('Не больше 10 премувов'); return true; }
    game.premoves.push({ from: game.sel, to: s });
    clearSel(); renderSquares(); renderPieces(); renderStatus(); renderBars();
    return true;
  }
  return false;
}
function commit(m){ clearSel(); makeMove(m); }

function animate(m, done){
  const el = $(`#pieces .piece[data-sq="${m.from}"]`);
  if(!el){ done(); return; }
  el.classList.remove('dragging'); el.classList.add('moving');
  let i = 0;
  (function step(){
    if(i >= m.path.length){ setTimeout(done, V.chess ? 15 : 40); return; }
    placeEl(el, m.path[i]);
    const capEl = m.caps[i] != null && $(`#pieces .piece[data-sq="${m.caps[i]}"]`);
    if(capEl) capEl.classList.add('captured');
    i++;
    setTimeout(step, V.chess ? 125 : 150);
  })();
}

function makeMove(m){
  if(game.review){ reviewMove(m); return; }
  const side = game.turn, gid = game.id;
  game.animating = true;
  animate(m, () => {
    if(!game || game.id !== gid) return;
    playMoveSound(m);
    if(game.undo) game.hist.push({ board: game.board.slice(), turn: side, nMoves: game.moves.length, last: game.last,
      ply: game.ply, lastCapPly: game.lastCapPly, reps: new Map(game.reps), flipped: game.flipped });
    const san = V.chess ? cSan(game.board, m) : notation(m);
    game.board = applyMove(game.board, m);
    if(V.chess && cInCheck(game.board, -side)) setTimeout(SND.check, 70);
    game.moves.push(san);
    game.mvs.push(V.chess ? { from:m.from, path:m.path, caps:m.caps, to:m.to, promote:m.promote, castle:m.castle, rf:m.rf, kt:m.kt, rt:m.rt, ep:m.ep, dbl:m.dbl, san }
                          : { from:m.from, path:m.path, caps:m.caps, to:m.to, promote:m.promote });
    game.last = m; game.ply++;
    if(m.caps.length) game.lastCapPly = game.ply;
    if(game.tc.sec && game.inc && !game.over) game.clocks[side] += game.inc * 1000;   // добавка за ход
    if(game.online && !game.over){
      if(side === game.me) netSend(game.online.key, 'move', { gid: game.online.gid, n: notation(m), clock: game.clocks[side] });
      else if(game.oppClock != null && game.tc.sec){ game.clocks[side] = game.oppClock; game.oppClock = null; }   // время соперника — как у него
    }
    game.turn = -side; game.animating = false;
    if(game.over){ renderAll(); return; }
    const next = genMoves(game.board, game.turn);
    if(V.chess){
      if(!next.length){ if(cInCheck(game.board, game.turn)) endGame(game.turn === game.me ? 'loss' : 'win', 'mate'); else endGame('draw', 'stalemate'); return; }
      if(game.board[66] >= 100){ endGame('draw', 'fifty'); return; }
      if(cNoMaterial(game.board)){ endGame('draw', 'material'); return; }
      if(countRep() >= 3){ endGame('draw', 'repetition3'); return; }
    } else {
      if(!next.length){
        const hasPieces = game.board.some(v => v*game.turn > 0);
        endGame(game.turn === game.me ? 'loss' : 'win', hasPieces ? 'blocked' : 'nopieces');
        return;
      }
      if(countRep() >= 5){ endGame('draw', 'repetition'); return; }
    }
    if(game.puzzle && side === game.me && puzzleAfterMove()) return;
    if(game.friend && game.friendFlip){ game.flipped = game.turn === -1; buildBoard(); }
    if(game.bot && side !== game.me && !game.puzzle) maybeBotOffersDraw();
    // выбор шашки, начатый как премув, становится обычным выбором
    if(game.sel != null && !game.cands){
      const s = game.sel; clearSel();
      if(!game.premoves.length && myTurn() && game.board[s]*game.me > 0) game.sel = s, game.cands = legalMine().filter(x => x.from === s);
    }
    renderAll();
    if(game.friend) return;
    if(game.turn !== game.me){ game.online ? pumpNet() : scheduleBot(); }
    else tryPremove();
  });
}

function tryPremove(){
  if(!game.premoves.length) return;
  const pm = game.premoves.shift();
  const ms = legalMine().filter(m => m.from === pm.from && m.to === pm.to).sort((a,b) => b.caps.length - a.caps.length);
  if(!ms.length){
    game.premoves = []; clearSel();
    renderSquares(); renderPieces(); renderStatus(); renderBars();
    toast('Премув отменён — так ходить нельзя');
    return;
  }
  const gid = game.id;
  setTimeout(() => {
    if(game && game.id === gid && myTurn()) makeMove(ms[0]);
    else if(game){ game.premoves = []; renderSquares(); renderPieces(); }
  }, 30);
}

function scheduleBot(){
  game.thinking = true; renderBars(); renderStatus();
  const gid = game.id, side = game.turn, token = ++game.botToken;
  const left = game.clocks[side];
  // «время на раздумье»: 0.7–1.7 с, но при малом запасе времени бот ускоряется
  const delay = game.tc.sec ? Math.min(700 + Math.random()*1000, left/25 + game.inc*300) : 800 + Math.random()*1000;
  setTimeout(() => {
    if(!game || game.id !== gid || game.over || game.botToken !== token) return;
    const timeMs = game.tc.sec ? Math.min(game.bot.time, game.clocks[side]/20 + game.inc*500) : game.bot.time;
    const finish = m => {
      if(!game || game.id !== gid || game.over || game.botToken !== token || !m) return;
      game.thinking = false;
      makeMove(m);
    };
    const bookMv = !game.bot.sf ? botBookMove() : null;     // первые ходы — из дебютной теории
    if(bookMv){ finish(bookMv); return; }
    const own = () => ENGINE.ask({ variant: game.variant, board: game.board, side, bot: game.bot, time: timeMs }) || Promise.resolve(null);
    const pr = V.chess && game.bot.sf && SF.ok
      ? SF.best(game.board, side, Object.assign({}, game.bot, { sfTime: Math.max(150, Math.min(game.bot.sfTime || 800, timeMs)) })).then(n => { if(!n && !scheduleBot.warned){ scheduleBot.warned = 1; toast('Stockfish не ответил — этот ход бот сделал встроенным движком'); } return n || own(); })
      : own();
    if(pr) pr.then(n => {
      if(!game || game.id !== gid || game.botToken !== token) return;
      setVariant(game.variant);
      const ms = genMoves(game.board, side);
      const fm = sfFind(ms, n);
      if(fm){ finish(fm); return; }
      (ENGINE.ask({ variant: game.variant, board: game.board, side, bot: game.bot, time: timeMs }) || Promise.resolve(null))
        .then(n2 => { if(!game || game.id !== gid || game.botToken !== token) return; setVariant(game.variant); const g2 = genMoves(game.board, side); finish(sfFind(g2, n2) || chooseBotMove(game.board, side, game.bot, timeMs)); });
    });
    else finish(chooseBotMove(game.board, side, game.bot, timeMs));
  }, delay);
}

/* ---------- возврат хода ----------
   С ботом откатываемся к своему последнему ходу (ход бота тоже отменяется),
   с другом — на один ход назад. */
function undoMove(){
  if(!game || game.over || game.review || !game.undo) return;
  if(game.animating){ toast('Подожди, пока закончится ход'); return; }
  let i = game.hist.length - 1;
  if(!game.friend) while(i >= 0 && game.hist[i].turn !== game.me) i--;
  if(i < 0){ toast('Возвращать пока нечего'); return; }
  const h = game.hist[i];
  game.hist.length = i;
  game.board = h.board; game.turn = h.turn; game.last = h.last; game.ply = h.ply; game.lastCapPly = h.lastCapPly;
  game.reps = h.reps; game.flipped = h.flipped;
  game.moves.length = h.nMoves; game.mvs.length = h.nMoves;
  game.botToken++; game.thinking = false; game.botOffer = false;
  game.premoves = []; game.hint = null; game.arrows = []; game.circles = []; clearSel();
  game.undos = (game.undos || 0) + 1;
  buildBoard(); renderAll();
  if(!game.friend && game.turn !== game.me) scheduleBot();
}

function botScore(){
  const bs = -game.me;
  deadline = performance.now() + 300; abort = false; nodes = 0;
  let sc = game.turn === bs ? negamax(game.board, bs, 5, -INF, INF, 0) : -negamax(game.board, game.me, 5, -INF, INF, 0);
  if(abort){ abort = false; sc = bs * evaluate(game.board); }
  return sc;
}
function maybeBotOffersDraw(){
  const onlyKings = game.board.every(v => Math.abs(v) !== 1);
  if(onlyKings && game.ply - game.lastCapPly >= 16 && game.ply - game.botOfferPly >= 20 && Math.abs(botScore()) <= 60){
    game.botOffer = true; game.botOfferPly = game.ply;
  }
}

const REASONS = {
  win:  { time:'у соперника кончилось время', blocked:'соперник заперт — ходов нет', nopieces:'все шашки соперника взяты', resign:'соперник сдался', left:'соперник покинул игру' },
  loss: { time:'у тебя кончилось время', blocked:'твои шашки заперты — ходов нет', nopieces:'все твои шашки взяты', resign:'ты сдался' },
  draw: { agreement:'по взаимному согласию', repetition:'позиция повторилась 5 раз' }
};
function endGame(result, reason, silent){
  if(!game || game.over || game.review) return;
  if(game.puzzle){ puzzleEnd(result, reason); return; }
  game.over = true; game.thinking = false; game.premoves = []; clearSel();
  const u = me(), key = rKey(game.variant, game.tc.id);
  const R = u.ratings[key] ?? 1000;
  let delta = 0;
  const oppElo = game.friend ? null : game.online ? (game.online.rating || 1000) : game.bot.elo;
  if(!game.friend && !game.undo && !game.casual){
    const exp = 1 / (1 + Math.pow(10, (oppElo - R)/400));
    const score = result === 'win' ? 1 : result === 'draw' ? .5 : 0;
    delta = Math.round(32 * (score - exp));
    u.ratings[key] = R + delta;
  }
  const rec = { date: Date.now(), variant: game.variant, friend: game.friend,
    opp: oppName(), oppElo, color: game.me === 1 ? 'white' : 'black', tc: game.tc.id, inc: game.inc, result, reason,
    moves: game.moves.length, rating: Math.round(R + delta), delta, mv: game.mvs.slice(), unrated: !game.friend && (game.undo || !!game.casual) };
  if(game.online){ rec.online = true; rec.oppKey = game.online.key; rec.oppAva = game.online.avatar; }
  if(game.start){ rec.start = game.start.slice(); rec.seed = game.seed; }
  u.history.unshift(rec); cloudAddGame(rec);
  if(u.history.length > 500) u.history.length = 500;
  save(); renderMeMini();
  let title = { win:'Победа!', loss:'Поражение', draw:'Ничья' }[result];
  if(game.friend && result !== 'draw') title = `Победа: ${esc(result === 'win' ? u.nick : game.friendName)}!`;
  game.resultText = `${title} — ${REASONS[result][reason]}`.replace(/<[^>]+>/g, '');
  if(current === 'game') renderAll();
  updateGameBanner();
  if(silent) return;
  SND[result]();
  if(result === 'win' && game.bot && game.bot.elo >= 1400) fireworks();
  showResult({ result, reason, rec, delta, newR: Math.round(R + delta) });
  heartbeat();
}

/* ---------- фейерверк (победа над ботом 1400+) ---------- */
function fireworks(){
  const cv = document.createElement('canvas'); cv.className = 'fw'; document.body.appendChild(cv);
  const ctx = cv.getContext('2d');
  const W = cv.width = innerWidth, H = cv.height = innerHeight;
  const colors = ['#ff5252','#ffd740','#69f0ae','#40c4ff','#e040fb','#ffab40','#ffffff'];
  const rockets = [], parts = [];
  const t0 = performance.now(); let last = t0;
  const launch = () => rockets.push({ x: W*(.15 + Math.random()*.7), y: H, vx: (Math.random()-.5)*2,
    vy: -Math.sqrt(2*.12*H*(.45 + Math.random()*.3)), col: colors[Math.floor(Math.random()*colors.length)] });
  function explode(r){
    SND.pop();
    const n = 70 + Math.random()*40;
    for(let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2, sp = 1 + Math.random()*5;
      parts.push({ x:r.x, y:r.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, col: Math.random() < .25 ? '#fff' : r.col });
    }
  }
  function frame(now){
    const dt = Math.min(32, now - last) / 16.7; last = now;
    const el = now - t0;
    if(el < 3500 && Math.random() < .09*dt) launch();
    ctx.globalCompositeOperation = 'destination-out'; ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation = 'lighter';
    for(let i=rockets.length-1;i>=0;i--){
      const r = rockets[i]; r.x += r.vx*dt; r.y += r.vy*dt; r.vy += .12*dt;
      ctx.fillStyle = r.col; ctx.beginPath(); ctx.arc(r.x, r.y, 2.5, 0, 7); ctx.fill();
      if(r.vy >= -1){ explode(r); rockets.splice(i,1); }
    }
    for(let i=parts.length-1;i>=0;i--){
      const p = parts[i]; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += .06*dt; p.vx *= .985; p.life -= .011*dt;
      if(p.life <= 0){ parts.splice(i,1); continue; }
      ctx.globalAlpha = p.life; ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if(el < 3500 || rockets.length || parts.length) requestAnimationFrame(frame); else cv.remove();
  }
  launch(); launch(); requestAnimationFrame(frame);
}

function lineMatches(pos){
  const rv = game.rv;
  for(let k=0;k<pos;k++) if(!rv.orig[k] || notation(rv.orig[k]) !== notation(rv.line[k])) return false;
  return true;

  for(let k=0;k<i;k++) b = applyMove(b, rv.line[k]);

/* ---------- оценка каждого хода партии ----------
   Для каждой позиции движок оценивает все возможные ходы (100 ≈ одна шашка)
   и сравнивает сыгранный ход с лучшим. */
const clampSc = x => x > WIN-1000 ? 2000 : x < -WIN+1000 ? -2000 : Math.max(-1500, Math.min(1500, x));
function classify(list, pl, prevC){
  if(list.length === 1) return 'forced';
  const best = clampSc(list[0].sc), played = clampSc(pl.sc), second = clampSc(list[1].sc);
  if(best <= -2000) return 'forced';                     // всё равно проигрыш, спасения нет
  const loss = best - played;
  if(loss >= 150) return 'blunder';
  if(loss >= 40) return 'inacc';
  if(pl === list[0] || loss <= 5){
    const only = best - second >= 150;                    // остальные ходы заметно хуже
    if(only && (prevC === 'blunder' || prevC === 'inacc' || (best >= 150 && second < 150) || (best > -80 && second <= -150))) return 'brilliant';
    return 'best';
  }
  return 'good';
}
function analyzeGame(rec, gid){
  game.anProgress = 0;
  runAnalysis(rec, k => { game.anProgress = k; renderReviewExtras(); },
    () => { if(!game.owner) cloudUpdateGame(rec); setVariant(game.variant); renderReviewExtras(); renderMoves(); renderPieces(); },
    () => game && game.id === gid);
}
function renderReviewExtras(){
  const rv = game.rv, rec = game.rec, an = rec.an;
  // заметка о текущем ходе
  let note = '<span class="muted">Начальная позиция. Жми ▶ или стрелку →</span>';
  if(rv.pos > 0){
    const m = rv.line[rv.pos-1];
    if(!lineMatches(rv.pos)) note = `<span><b>${notation(m)}</b><small>Свой вариант — без оценки</small></span>`;
    else if(an && an[rv.pos-1]){
      const a = an[rv.pos-1];
      const better = ['blunder', 'mistake', 'miss', 'inacc', 'good', 'excellent'].includes(a.c) && a.b !== notation(m) ? ` ${tr('Лучше')}: ${a.bs || a.b}` : '';
      note = `${mcIcon(a.c, 34)}<span>${m.san || notation(m)} — ${MC[a.c].name}<small>${a.c === 'book' && a.o ? tr('Дебют') + ': ' + a.o : MC[a.c].tip + '.'}${better}</small></span>`;
    } else note = `<span><b>${notation(m)}</b><small>Оценка хода появится после анализа</small></span>`;
  }
  $('#moveNote').innerHTML = note;
  // прогресс анализа или итоговая таблица
  if(!an){
    const p = game.anProgress || 0, n = rec.mv.length;
    $('#anBox').innerHTML = `<div style="margin-top:12px;font-weight:800">Анализ партии… ${p} / ${n}</div><div class="an-prog"><span style="width:${n ? p/n*100 : 100}%"></span></div>`;
    return;
  }
  // номера ходов стороны side с оценкой k
  const idxs = (side, k) => an.map((a,i) => i).filter(i => (i % 2 ? -1 : 1) === side && an[i].c === k);
  const onLine = lineMatches(rv.pos);
  const cell = (side, k) => {
    const list = idxs(side, k), at = onLine ? list.indexOf(rv.pos - 1) : -1;
    const sub = at >= 0 && list.length > 1 ? `<small>${at+1}/${list.length}</small>` : '';
    return `<td><button class="jump" data-s="${side}" data-k="${k}" ${list.length ? '' : 'disabled'} title="${list.length ? 'Показать этот ход' : ''}">${list.length}${sub}</button></td>`;
  };
  $('#anBox').innerHTML = `<table class="an-table"><tr><th></th><th>${esc((game.owner || me()).nick)}</th><th>${esc(rec.opp)}</th></tr>
    ${MC_ORDER.filter(k => k !== 'book' || V.chess).map(k => `<tr><td>${mcIcon(k, 20)}${MC[k].name}</td>${cell(game.me, k)}${cell(-game.me, k)}</tr>`).join('')}</table>`;
  $('#anBox').querySelectorAll('.jump').forEach(b => b.onclick = () => {
    if(game.animating) return;
    const list = idxs(+b.dataset.s, b.dataset.k); if(!list.length) return;
    const at = lineMatches(rv.pos) ? list.indexOf(rv.pos - 1) : -1;
    const i = list[(at + 1) % list.length];            // следующий такой ход (по кругу)
    if(!lineMatches(i + 1)) rv.line = rv.orig.slice();  // был свой вариант — возвращаемся к партии
    setPos(i + 1);
  });
}

/* ---------- шкала перевеса ---------- */
const evalCache = new Map();
function evalWhite(b, turn, timeMs){
  const key = game.variant + b.join(',') + '|' + turn;
  if(evalCache.has(key)) return evalCache.get(key);
  let sc;
  if(!genMoves(b, turn).length) sc = -WIN;
  else {
    sc = turn * evaluate(b);
    deadline = performance.now() + timeMs; abort = false; nodes = 0;
    for(let d=1; d<=30; d++){
      const v = negamax(b, turn, d, -INF, INF, 0);
      if(abort){ abort = false; break; }
      sc = v;
      if(Math.abs(v) > WIN - 1000) break;
    }
  }
  const w = sc * turn;
  evalCache.set(key, w);
  return w;
}
function updateEval(){
  if(!game || !game.review) return;
  const gid = game.id, pos = game.rv.pos, line = game.rv.line;
  setTimeout(() => {
    if(!game || game.id !== gid || !game.review || game.rv.pos !== pos || game.rv.line !== line) return;
    if(V.chess && SF.ok && genMoves(game.board, game.turn).length){
      const key = 'sf' + game.board.join(',') + '|' + game.turn, same = () => game && game.id === gid && game.review && game.rv.pos === pos && game.rv.line === line;
      if(evalCache.has(key)){ renderEval(evalCache.get(key)); return; }
      SF.evalWhite(game.board, game.turn)
        .then(w => { if(w == null) throw new Error('sf'); evalCache.set(key, w); if(same()) renderEval(w); })
        .catch(() => { if(same()) renderEval(evalWhite(game.board, game.turn, 250)); });
      return;
    }
    renderEval(evalWhite(game.board, game.turn, 250));
  }, 30);
}
function renderEval(w){
  const bar = $('#evalBar'), fill = bar.querySelector('.w'), lbl = bar.querySelector('.lbl');
  const forced = Math.abs(w) > WIN - 1000;
  let frac, label, text, sub;
  if(forced){
    const n = Math.ceil((WIN - Math.abs(w)) / 2);
    frac = w > 0 ? 1 : 0;
    label = w > 0 ? '+∞' : '−∞';
    const who = w > 0 ? 'Белые' : 'Чёрные';
    text = n === 0 ? `${who} победили` : `${who} выигрывают`;
    sub = n === 0 ? 'у соперника нет ходов' : `при точной игре — за ${n} ход${n === 1 ? '' : n < 5 ? 'а' : 'ов'}`;
  } else {
    frac = .5 + .5 * Math.tanh(w / 300);
    const p = Math.abs(w / 100);
    label = (w > 0 ? '+' : w < 0 ? '−' : '') + p.toFixed(1);
    text = p < .3 ? 'Примерно равно' : `${w > 0 ? 'Белые' : 'Чёрные'} ${p < 1 ? 'чуть лучше' : p < 2.5 ? 'лучше' : 'с большим перевесом'}`;
    sub = `оценка ${label} ${V.chess ? "(1.0 ≈ одна лишняя пешка)" : "(1.0 ≈ одна лишняя шашка)"}`;
  }
  fill.style.height = (frac * 100).toFixed(1) + '%';
  bar.classList.toggle('flip', game.flipped);
  const whiteBottom = !game.flipped, atWhite = w >= 0;
  lbl.textContent = label;
  lbl.style.color = atWhite ? '#222' : '#eee';
  lbl.style.top = lbl.style.bottom = '';
  if(atWhite === whiteBottom) lbl.style.bottom = '4px'; else lbl.style.top = '4px';
  bar.title = `${text}: ${sub}`;
  $('#evalText').innerHTML = `${text}<small>${sub}</small>`;
}

// кольцевая диаграмма: parts = [[значение, цвет, подпись], ...]
function donutRing(parts, center, sub){
  const total = parts.reduce((s,p) => s + p[0], 0), C = 2*Math.PI*44;
  if(!total) return `<svg viewBox="0 0 120 120" class="donut"><circle cx="60" cy="60" r="44" fill="none" stroke="var(--line)" stroke-width="14"/><text x="60" y="66" text-anchor="middle" font-size="15" font-weight="700" fill="var(--muted)">0 игр</text></svg>`;
  let off = 0, segs = '';
  for(const [v, col] of parts){
    const len = v/total*C; if(!len) continue;
    segs += `<circle cx="60" cy="60" r="44" fill="none" stroke="${col}" stroke-width="14" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;
    off += len;
  }
  return `<svg viewBox="0 0 120 120" class="donut">${segs}<text x="60" y="62" text-anchor="middle" font-size="22" font-weight="800" fill="var(--text)" class="fd">${center}</text><text x="60" y="78" text-anchor="middle" font-size="9" font-weight="700" fill="var(--muted)">${sub}</text></svg>`;
}
// график рейтинга по партиям
function ratingChart(u, variant, tc){
  const games = u.history.filter(g => (g.variant || '32') === variant && g.tc === tc && !g.friend && !g.unrated).slice().reverse();
  if(!games.length) return `<div class="chart-empty muted">Сыграй рейтинговую партию (${VAR_NAMES[variant]} · ${tcById(tc).short}) — здесь появится график</div>`;
  const pts = [games[0].rating - (games[0].delta || 0), ...games.map(g => g.rating)].slice(-40);
  const W = 460, H = 190, L = 44, R = 10, T = 12, B = 22;
  let lo = Math.min(...pts), hi = Math.max(...pts);
  if(hi - lo < 40){ lo -= 20; hi += 20; }
  const pad = (hi - lo) * .12; lo = Math.floor((lo - pad)/10)*10; hi = Math.ceil((hi + pad)/10)*10;
  const x = i => L + (pts.length === 1 ? 0 : i * (W - L - R) / (pts.length - 1));
  const y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  const grid = [0,1,2,3].map(k => { const v = Math.round(lo + (hi - lo) * k / 3); return `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="cg"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" class="ct">${v}</text>`; }).join('');
  const line = pts.map((v,i) => `${x(i)},${y(v)}`).join(' ');
  const area = `${x(0)},${H-B} ${line} ${x(pts.length-1)},${H-B}`;
  const dots = pts.length <= 20 ? pts.map((v,i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3.4" class="cd"><title>${v}</title></circle>`).join('') : '';
  const last = pts[pts.length-1], first = pts[0], d = last - first;
  return `<svg viewBox="0 0 ${W} ${H}" class="rchart">
      <defs><linearGradient id="rg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".28"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs>
      ${grid}<polygon points="${area}" fill="url(#rg)"/><polyline points="${line}" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>${dots}
      <circle cx="${x(pts.length-1)}" cy="${y(last)}" r="5" class="cl"/></svg>
    <div class="chart-cap"><span>Партий: ${games.length}</span><span>Сейчас: <b>${last}</b> <span class="delta ${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '+' : ''}${d}</span></span></div>`;
}

let playerQuery = '';
function renderPlayers(){
  const n = Object.keys(db.accounts).length - 1;
  $('#playersBox').innerHTML = `
    <div class="page-head"><div><div class="eyebrow">Сообщество</div><h1 class="display">Игроки</h1></div></div>
    <div class="card">

    </div>`;

}
function renderPlayerList(){
  const box = $('#plList'); if(!box) return;
  const q = playerQuery.trim().toLowerCase(), m = db.menu;
  const order = { playing:0, searching:0, online:0, offline:1 };
  const list = Object.entries(db.accounts).filter(([k,a]) => k !== db.current && (!q || a.nick.toLowerCase().includes(q)))
    .sort((x,y) => order[statusOf(x[0])] - order[statusOf(y[0])] || ratingOf(y[1], m.variant, m.tc) - ratingOf(x[1], m.variant, m.tc));
  box.innerHTML = list.length ? list.map(([k,a]) => {
    const rel = relation(k);
    const fb = rel === 'friend' ? `<span class="tag-fr">${ICON.check} Друг</span>`
      : rel === 'sent' ? '<span class="tag-fr muted">Заявка отправлена</span>'
      : rel === 'incoming' ? `<button class="btn sm primary" data-fa="${esc(k)}">${ICON.addUser} Принять</button>`
      : `<button class="btn sm" data-fadd="${esc(k)}">${ICON.addUser} В друзья</button>`;
    return `<div class="pl-row" data-open="${esc(k)}"><span class="ava round">${avatarHTML(a.avatar)}</span>
      <div class="pl-nm"><b>${nickH(k)}</b>${statusDot(k)}</div>
      <div class="pl-r"><b>${ratingOf(a, m.variant, m.tc)}</b><small>${VAR_NAMES[m.variant]} · ${tcById(m.tc).short}</small></div>
      <div class="pl-r"><b>${a.gamesN || 0}</b><small>партий</small></div>
      <div class="pl-btns">${fb}<button class="btn sm" data-inv="${esc(k)}" ${statusOf(k)==='offline'?'disabled':''}>${ICON.swords} На партию</button></div></div>`;
  }).join('') : `<p class="muted" style="padding:14px 4px">${q ? 'Никого не нашли. Проверь ник.' : 'Других игроков пока нет. Зарегистрируй второй аккаунт в другой вкладке, чтобы попробовать.'}</p>`;
  bindPeople(box);
  box.querySelectorAll('[data-fadd]').forEach(b => b.onclick = e => { e.stopPropagation(); sendFriendRequest(b.dataset.fadd); renderPlayerList(); });
  box.querySelectorAll('[data-fa]').forEach(b => b.onclick = e => { e.stopPropagation(); acceptFriend(b.dataset.fa); renderPlayerList(); });
}

    <div class="sq dark"><span class="pcw w k"><span class="disc">${CROWN}</span></span></div><div class="sq light"></div></div>`;
}
// настройки меняются «черновиком»: видно сразу, сохраняется по кнопке на плашке
let settingsBackup = null;
function draftStart(){
  if(pending) return;
  settingsBackup = clone(db.settings);
  markDirty('settings', () => { settingsBackup = null; save(); }, () => {
    db.settings = settingsBackup; settingsBackup = null; applyTheme(); applyLayout();
    if(current === 'settings') renderSettings();
  });
}
function checkDraftSame(){      // вернул всё как было — плашка не нужна
  if(settingsBackup && JSON.stringify(settingsBackup) === JSON.stringify(db.settings)){ settingsBackup = null; hideSaveBar(); }
}
function setDraft(k, v){
  draftStart();
  db.settings[k] = v;
  if(k === 'theme') applyTheme();
  if(k === 'topbar') applyLayout();
  checkDraftSame();
  renderSettings();
}

const trName = a => EN[a] || a;          // имя бота переводится, ник игрока — нет
function trCore(c){
  if(EN[c] != null) return EN[c];
  for(const [rx, to] of EN_RX){
    if(!to) continue;
    const m = c.match(rx);
    if(m){ const r = typeof to === 'function' ? to(...m) : c.replace(rx, to); if(r != null) return r; }
  }
  return null;
}
// перевод одной строки: целиком, по кускам « · », без знаков по краям, по известным фразам внутри
function tr(s){
  if(LANG() !== 'en' || s == null) return s;
  s = String(s);
  if(!/[А-яЁё]/.test(s)) return s;
  return trAny(s) ?? s;
}
function trAny(s){
  let r = trCore(s); if(r != null) return r;
  const m = s.match(/^([^А-яЁё]*)([\s\S]*?[А-яЁё])([^А-яЁё]*)$/);
  if(m && (m[1] || m[3])){ r = trCore(m[2]); if(r != null) return m[1] + r + m[3]; }
  for(const sep of [' · ', ' — ', ': ', ', ']){
    if(s.includes(sep)){
      const parts = s.split(sep).map(p => /[А-яЁё]/.test(p) ? trAny(p) : p);
      if(parts.every(p => p != null)) return parts.join(sep);
    }
  }
  return null;
}
// перевод текста узла с сохранением пробелов по краям
function trText(t){
  const m = t.match(/^(\s*)([\s\S]*?)(\s*)$/);
  if(!/[А-яЁё]/.test(m[2])) return t;
  const r = trAny(m[2]);
  return r == null ? t : m[1] + r + m[3];
}
const NO_TR = 'script,style,[translate="no"]';   // поля ввода не трогаем: у них нет текста, а подсказки (placeholder) переводим
function trNode(n){
  if(n.nodeType === 3){
    const p = n.parentElement; if(!p || p.closest(NO_TR)) return;
    const v = trText(n.data); if(v !== n.data) n.data = v;
    return;
  }
  if(n.nodeType !== 1 || n.closest(NO_TR)) return;
  for(const a of ['placeholder', 'title']){ const v = n.getAttribute(a); if(v && /[А-яЁё]/.test(v)){ const t = trText(v); if(t !== v) n.setAttribute(a, t); } }
  const w = document.createTreeWalker(n, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT, {
    acceptNode: x => x.nodeType === 1 && x.matches(NO_TR) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  let x; while((x = w.nextNode())){
    if(x.nodeType === 3){ if(/[А-яЁё]/.test(x.data)){ const v = trText(x.data); if(v !== x.data) x.data = v; } }
    else for(const a of ['placeholder', 'title']){ const v = x.getAttribute(a); if(v && /[А-яЁё]/.test(v)){ const t = trText(v); if(t !== v) x.setAttribute(a, t); } }
  }
}
function startI18n(){
  document.documentElement.lang = LANG();
  if(LANG() !== 'en') return;
  document.title = 'Checkers';
  trNode(document.body);
  new MutationObserver(ms => {
    for(const m of ms){
      if(m.type === 'characterData') trNode(m.target);
      else if(m.type === 'attributes') trNode(m.target);
      else m.addedNodes.forEach(trNode);
    }
  }).observe(document.body, { childList:true, subtree:true, characterData:true, attributes:true, attributeFilter:['placeholder','title'] });
}

  <ul>

function pushChat(m){ (game.chat = game.chat || []).push(m); if(game.chat.length > 100) game.chat.shift(); if(current === 'game') renderChat(); }
function sendChat(text){
  text = String(text || '').replace(/\s+/g, ' ').trim().slice(0, 200);
  if(!text || !chatOn()) return;
  const u = me();
  if(u.chatBanUntil > Date.now()){ toast(tr('Чат запрещён') + ' ' + untilTxt(u.chatBanUntil)); return; }
  if(Date.now() - chatLastSend < 800){ toast('Не так быстро'); return; }
  chatLastSend = Date.now();
  netSend(game.online.key, 'chat', { gid: game.online.gid, text });

netHandlers.chat = msg => {
  if(!game || !game.online || game.review || game.online.gid !== (msg.data || {}).gid) return;
  const text = String(msg.data.text || '').slice(0, 200).trim(); if(!text) return;
  (game.chat = game.chat || []).push({ text });

};

/* ---------- анализ партии (общий для разбора и окна конца партии) ---------- */
function runAnalysis(rec, onProg, onDone, alive){
  if((VARIANTS[rec.variant] || {}).chess && SF.ok && !runAnalysis.noSF){ runAnalysisSF(rec, onProg, onDone, alive); return; }
  const line = rec.mv, an = [], per = (rec.variant === '64') ? 160 : 110;
  let b = null, k = 0;
  (function step(){
    if(alive && !alive()) return;
    setVariant(rec.variant || '32');               // вариант мог смениться (мини-доска на главной)
    if(!b) b = rec.start ? rec.start.slice() : initBoard();
    if(k >= line.length){ rec.an = an; if(onDone) onDone(an); return; }
    const bk = V.chess && !rec.start ? bookAt(line, k) : null;          // ход из дебютной теории — движок не нужен
    if(bk){ an.push({ c:'book', b: notation(line[k]), o: bk }); b = applyMove(b, line[k]); k++; if(onProg) onProg(k, line.length); setTimeout(step, 0); return; }
    const side = k % 2 ? -1 : 1, pn = notation(line[k]);
    const list = rootScores(b, side, per);
    const pl = list.find(x => notation(x.m) === pn) || list[0];
    an.push(classify2(b, side, list, pl, an[k-1]));
    b = applyMove(b, line[k]); k++;
    if(onProg) onProg(k, line.length);
    setTimeout(step, 0);
  })();
}
// итог по своим ходам: хорошие / ошибки / плохие / точность
function reportOf(rec, side){
  const c = { good:0, inacc:0, blunder:0, best:0, forced:0, all:0 };
  (rec.an || []).forEach((a, i) => {
    if((i % 2 ? -1 : 1) !== side) return;
    c.all++;
    if(a.c === 'brilliant' || a.c === 'best'){ c.good++; c.best++; }
    else if(a.c === 'good' || a.c === 'book') c.good++;
    else if(a.c === 'inacc') c.inacc++;
    else if(a.c === 'blunder') c.blunder++;
    else c.forced++;
  });
  c.acc = c.all ? Math.round((c.good + c.forced) / c.all * 100) : 0;
  return c;
}

/* ---------- пиксельные аватарки (рисуются кодом по клеткам 16×16) ---------- */
function pixAvatar(o){
  const G = Array.from({ length: 16 }, () => Array(16).fill(null));
  const set = (x, y, c) => { if(x >= 0 && x < 16 && y >= 0 && y < 16) G[y][x] = c; };
  const rect = (x0, y0, x1, y1, c) => { for(let y = y0; y <= y1; y++) for(let x = x0; x <= x1; x++) set(x, y, c); };
  const sh = (hex, k) => { const n = parseInt(hex.slice(1), 16); const f = v => Math.max(0, Math.min(255, Math.round(v * k))); return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(v => f(v).toString(16).padStart(2, '0')).join(''); };
  if(o.hood) rect(3, 2, 12, 12, sh(o.shirt, .8));                       // капюшон за головой
  if(o.hair && o.style === 'long'){ rect(3, 3, 12, 12, o.hair); }
  // тело и шея
  rect(4, 12, 11, 12, o.shirt); rect(3, 13, 12, 13, o.shirt); rect(2, 14, 13, 15, o.shirt);
  rect(2, 15, 13, 15, sh(o.shirt, .85));
  rect(7, 11, 8, 11, sh(o.skin, .85));
  // голова
  rect(4, 3, 11, 10, o.skin); set(4, 3, null); set(11, 3, null); set(4, 10, null); set(11, 10, null);
  if(o.hair && o.style === 'long'){ set(4, 3, o.hair); set(11, 3, o.hair); set(4, 10, o.hair); set(11, 10, o.hair); }
  set(3, 7, o.skin); set(12, 7, o.skin); set(3, 8, sh(o.skin, .9)); set(12, 8, sh(o.skin, .9));
  rect(5, 10, 10, 10, sh(o.skin, .88));
  // глаза, рот, румянец
  const eye = o.eye || '#1b1b1b';
  rect(6, 7, 6, 8, eye); rect(9, 7, 9, 8, eye);
  if(o.smile) { set(7, 9, '#9b4636'); set(8, 9, '#9b4636'); }
  if(o.blush) { set(5, 9, '#f08a8a'); set(10, 9, '#f08a8a'); }
  // волосы
  const H = o.hair;
  if(H && o.style !== 'none'){
    rect(4, 2, 11, 4, H); rect(5, 1, 10, 1, H); set(4, 5, H); set(11, 5, H);
    if(o.style === 'spiky'){ set(4, 1, H); set(6, 0, H); set(9, 0, H); set(11, 1, H); rect(5, 5, 6, 5, H); }
    if(o.style === 'side'){ rect(4, 5, 7, 5, H); set(4, 6, H); }
    if(o.style === 'bun'){ rect(6, 0, 9, 0, H); rect(7, -1, 8, 0, H); }
    if(o.style === 'curly'){ set(3, 3, H); set(12, 3, H); set(3, 5, H); set(12, 5, H); set(5, 0, H); set(8, 0, H); set(10, 0, H); }
    if(o.style === 'long'){ rect(3, 4, 4, 12, H); rect(11, 4, 12, 12, H); rect(4, 5, 5, 5, H); rect(10, 5, 11, 5, H); }
  }
  if(o.cap){ rect(4, 1, 11, 4, o.cap); rect(5, 0, 10, 0, o.cap); rect(3, 5, 12, 5, sh(o.cap, .7)); set(7, 2, '#ffffff'); set(8, 2, '#ffffff'); }
  if(o.crown){ rect(4, 1, 11, 2, '#f4c430'); set(4, 0, '#f4c430'); set(7, 0, '#f4c430'); set(8, 0, '#f4c430'); set(11, 0, '#f4c430'); set(7, 1, '#e23b3b'); set(8, 1, '#e23b3b'); }
  if(o.mask){ rect(4, 2, 11, 6, o.mask); rect(4, 9, 11, 10, o.mask); rect(3, 6, 3, 9, o.mask); rect(12, 6, 12, 9, o.mask); rect(12, 4, 14, 4, o.mask); set(14, 5, o.mask); }
  if(o.shades){ rect(5, 7, 7, 8, '#121212'); rect(8, 7, 10, 8, '#121212'); set(5, 7, '#4a4a4a'); set(8, 7, '#4a4a4a'); set(4, 7, '#121212'); set(11, 7, '#121212'); }
  if(o.phones){ rect(3, 1, 12, 1, o.phones); set(3, 2, o.phones); set(12, 2, o.phones); rect(2, 6, 3, 9, o.phones); rect(12, 6, 13, 9, o.phones); }
  if(o.antenna){ set(7, 0, o.antenna); set(7, 1, '#555'); set(7, 2, '#555'); set(8, 0, o.antenna); }
  if(o.strings){ rect(6, 13, 6, 14, '#ffffff'); rect(9, 13, 9, 14, '#ffffff'); }
  // контур: пустые клетки рядом с рисунком
  const OUT = '#1a1410', out = [];
  for(let y = 0; y < 16; y++) for(let x = 0; x < 16; x++) if(!G[y][x] && [[1,0],[-1,0],[0,1],[0,-1]].some(([dx, dy]) => G[y+dy] && G[y+dy][x+dx] && G[y+dy][x+dx] !== OUT)) out.push([x, y]);
  out.forEach(([x, y]) => G[y][x] = OUT);
  let r = '';
  for(let y = 0; y < 16; y++){ let x = 0; while(x < 16){ const c = G[y][x]; let e = x; while(e + 1 < 16 && G[y][e+1] === c) e++; if(c) r += `<rect x="${x}" y="${y}" width="${e - x + 1}" height="1" fill="${c}"/>`; x = e + 1; } }
  return `<svg viewBox="0 0 16 16" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"><rect width="16" height="16" fill="${o.bg}"/>${r}</svg>`;
}

function animRating(root){

function puzWinMove(b, side, n){
  for(const m of genMoves(b, side)){
    const b2 = applyMove(b, m), rs = genMoves(b2, -side);
    if(!rs.length){ if(!V.chess || cInCheck(b2, -side)) return m; continue; }   // в шахматах нужен именно мат, пат — не победа

function renderPuzzle(){

  if(z.tactic && z.waitBest && z.step === 1 && game.turn === game.me && !game.animating && !game.over){ z.waitBest = false; deadline = performance.now() + 900; abort = false; z.best2 = searchBest(game.board, 1, 4, 600); }

    if(!game || game.over || game.turn !== game.me){ toast('Подожди, пока закончится ход'); return; }
    const z = game.puzzle;

    if(!m){ toast('Отсюда уже не выиграть — начни заново'); return; }
    game.hint = m; game.puzzle.hinted = true; renderAnnot();

}
// после своего хода: проверяем, что выигрыш ещё возможен
function puzzleAfterMove(){
  const z = game.puzzle;
  if(z.tactic) return tacticAfterMove();
  z.left--;
  const replies = genMoves(game.board, -game.me);
  const ok = z.left > 0 && replies.every(r => puzWinMove(applyMove(game.board, r), game.me, z.left));
  if(ok){ renderPuzzle(); return false; }
  renderAll();
  setTimeout(() => puzzleEnd('loss', z.left > 0 ? 'wrong' : 'moves'), 350);
  return true;
}
function puzzleEnd(result, reason){
  if(!game || !game.puzzle || game.over) return;

  const z = game.puzzle, st = puzStore();
  if(result === 'win'){
    const first = !st.done[z.p.day];
    st.done[z.p.day] = 1;
    if(first){ st.streak = st.last === z.p.day - 1 ? st.streak + 1 : (st.last === z.p.day ? st.streak : 1); st.last = z.p.day; }
    puzSave(st);

  game.resultText = result === 'win' ? tr('Задача решена!') : tr('Не получилось');

  const streak = puzStreak(puzStore());

  modal(result === 'win'
    ? `<div class="res-cup" style="margin:0 0 6px">${LAUREL('l')}<img class="cup" src="icons/trophy.png" alt="">${LAUREL('r')}</div><h2>Задача решена!</h2>

    : `<div class="big-ico">${PIX('hint')}</div><h2>Не получилось</h2><p class="muted">${why}</p>`,
    result === 'win'

const BOOK_KEYS = new Map();          // начало партии → какие дебюты так начинаются
for(const [line, ru, en] of BOOK){
  const mv = line.split(' ');
  for(let k = 1; k <= mv.length; k++){
    const key = mv.slice(0, k).join(' ');
    const e = BOOK_KEYS.get(key) || { names: new Map(), exact: null };
    e.names.set(ru, en);
    if(k === mv.length) e.exact = [ru, en];
    BOOK_KEYS.set(key, e);
  }
}
function bookName(key){
  const e = BOOK_KEYS.get(key); if(!e) return null;
  if(e.exact) return e.exact;
  if(e.names.size === 1) return [...e.names][0];
  const i = key.lastIndexOf(' ');
  return i > 0 ? bookName(key.slice(0, i)) : ['Дебют', 'Opening'];
}
// название дебюта, если первые k+1 ходов партии есть в теории (иначе null)
function bookAt(line, k){
  const n = bookName(line.slice(0, k + 1).map(notation).join(' '));
  return n ? (LANG() === 'en' ? n[1] : n[0]) : null;
}

function pickPz(theme){
  const st = pzStats(), r = pzRating();
  let list = PZ.filter(p => theme === 'mix' || p.theme === theme);

}

function startThemePuzzle(theme, again){
  if(liveOnline()){ toast('Сначала закончи онлайн-партию'); go('game'); return; }
  const p = again || pickPz(theme); if(!p) return;
  const n = { mate1:1, mate2:2, mate3:3 }[p.theme] || 0;
  launchGame({ variant: 'chess', tc: '0', inc: 0, color: 'white', friend: false, bot: PUZ_BOT, undo: false });
  game.board = pzBoard(p); game.reps = new Map(); countRep();
  game.puzzle = { p: { no: p.id + 1, n: n || 2, chess: true, v: 'chess', themed: p.theme, title: PZ_THEMES.find(t => t[0] === p.theme)[1] },
    left: n || 2, theme: p.theme, pz: p, tactic: !n, step: 0, retry: !!again, base: (deadline = performance.now() + 3000, abort = false, cQuiesce(game.board, 1, -INF, INF, 0)), pickTheme: theme || p.theme };
  $('#playActions').hidden = true;
  renderAll();
}
// тактика (вилка/связка): 1) найти единственный выигрывающий ход, 2) после ответа забрать материал
function tacticAfterMove(){
  const z = game.puzzle, m = game.last;
  if(z.step === 0){
    if(notation(m) !== z.pz.sol){ renderAll(); setTimeout(() => puzzleEnd('loss', 'wrong'), 350); return true; }
    z.step = 1; z.left = 1; renderPuzzle(); toast(tr('Верно! Теперь забери материал'));
    z.waitBest = true;
    return false;
  }
  deadline = performance.now() + 3000; abort = false;
  const after = -cNegamax(game.board, -1, 2, -INF, INF, 0);        // перевес держится и после лучшего ответа соперника
  renderAll();
  const ok = after >= z.base + 120 || (z.best2 && notation(z.best2) === notation(m));     // лучший ход движка засчитывается всегда
  setTimeout(() => puzzleEnd(ok ? 'win' : 'loss', 'wrong'), 350);
  return true;
}
// рейтинг в задачах (как Эло: задача — «соперник» со своим рейтингом)
function pzRate(win){
  const z = game.puzzle; if(!z || !z.pz || z.retry || z.rated) return null;
  z.rated = true;
  const R = pzRating(), exp = 1 / (1 + Math.pow(10, (z.pz.rating - R) / 400));
  const delta = Math.round(28 * ((win && !z.hinted ? 1 : 0) - exp));
  me().ratings['puz:chess'] = R + delta; save();
  const st = pzStats(); st.n++; if(win && !z.hinted) st.ok++; st.done[z.pz.id] = 1; pzSaveStats(st);
  return { R: R + delta, delta };
}

const pgnDate = t => { const d = new Date(t || Date.now()); return d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0'); };
function recToPGN(rec, ownerNick){
  const w = rec.color === 'white', res = rec.result === 'draw' ? '1/2-1/2' : ((rec.result === 'win') === w ? '1-0' : '0-1');
  const tags = { Event: 'Шашки и шахматы', Site: 'https://joskiph7.github.io/shashki/', Date: pgnDate(rec.date), Round: '-',
    White: w ? ownerNick : rec.opp, Black: w ? rec.opp : ownerNick, Result: res };
  if(rec.start){ tags.Variant = 'Chess960'; tags.SetUp = '1'; tags.FEN = cFen(rec.start, 1); }
  return cMakePGN(tags, rec.start, rec.mv);
}
function exportPGN(){
  if(!game || !game.review || !V.chess) return;
  const txt = recToPGN(game.rec, (game.owner || me()).nick);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], { type: 'application/x-chess-pgn' }));
  a.download = 'partiya_' + pgnDate(game.rec.date).replace(/\./g, '-') + '.pgn';
  document.body.append(a); a.click(); a.remove();
  if(navigator.clipboard) navigator.clipboard.writeText(txt).then(() => toast('PGN сохранён и скопирован'), () => toast('PGN сохранён'));
  else toast('PGN сохранён');
}

        moves: p.moves.length, rating: 0, delta: 0, mv: p.moves, imported: true };

/* =========================================================
   13g. v14: STOCKFISH — сильнейший шахматный движок (лицензия GPL-3.0)
   Файл движка (~1,7 МБ) грузится с бесплатного CDN unpkg.com и работает в фоновом потоке.
   Если загрузить не получилось (нет интернета, CDN недоступен) — молча работает встроенный движок.
   ========================================================= */
const SF = (() => {
  const BASE = 'https://unpkg.com/stockfish@19.0.1/bin/stockfish-19-lite-single';
  let w = null, ready = null, queue = Promise.resolve(), onLine = null, failed = false, busy = false;
  function start(){
    if(ready) return ready;
    ready = new Promise((res, rej) => {
      try{
        // поток создаётся из «обёртки», которая подключает файл с CDN; путь к .wasm передаётся после #
        const blob = new Blob(['importScripts(' + JSON.stringify(BASE + '.js') + ');'], { type: 'text/javascript' });
        w = new Worker(URL.createObjectURL(blob) + '#' + encodeURIComponent(BASE + '.wasm'));
        const to = setTimeout(() => { failed = true; rej(new Error('timeout')); }, 60000);
        w.onmessage = e => { if(typeof e.data !== 'string') return; if(e.data.startsWith('bestmove')) busy = false; if(onLine) onLine(e.data); };
        w.onerror = () => { clearTimeout(to); failed = true; rej(new Error('load')); };
        onLine = l => { if(l === 'uciok'){ clearTimeout(to); onLine = null; w.postMessage('isready'); res(); } };
        w.postMessage('uci');
      }catch(e){ failed = true; rej(e); }
    });
    ready.catch(() => {});
    return ready;
  }
  // команды выполняются строго по очереди: ответы движка не перепутаются
  function run(cmds, until, limitMs){
    const job = queue.then(() => start()).then(() => new Promise((res, rej) => {
      const got = [];
      const to = setTimeout(() => { onLine = null; w.postMessage('stop'); rej(new Error('slow')); }, limitMs || 15000);
      const go = () => { onLine = l => { got.push(l); if(until(l)){ clearTimeout(to); onLine = null; res(got); } }; if(cmds.some(c => c.startsWith('go'))) busy = true; cmds.forEach(c => w.postMessage(c)); };
      if(!busy){ go(); return; }
      w.postMessage('stop');                                   // прошлый расчёт ещё идёт — останавливаем и ждём его «bestmove»
      let n = 0; const iv = setInterval(() => { if(!busy || ++n > 150){ clearInterval(iv); busy = false; go(); } }, 20);
    }));
    queue = job.catch(() => {});
    return job;
  }
  const is960 = b => !!(V && V.c960);
  const score = (kind, v) => kind === 'cp' ? +v : (+v > 0 ? WIN - (2 * +v - 1) : -(WIN - 2 * Math.abs(+v)));
  // поиск: [[первый ход, оценка за того, кто ходит], …] по линиям MultiPV
  async function search(b, side, go, multipv, strength){
    const cmds = [
      'setoption name UCI_Chess960 value ' + is960(b),
      'setoption name MultiPV value ' + (multipv || 1),
      'setoption name UCI_LimitStrength value ' + !!(strength && strength.elo),
      strength && strength.elo ? 'setoption name UCI_Elo value ' + Math.max(1320, Math.min(3190, strength.elo)) : null,
      'position fen ' + cFen(b, side), go
    ].filter(Boolean);
    const got = await run(cmds, l => l.startsWith('bestmove'), 60000);
    const best = {};
    for(const l of got){
      const m = l.match(/^info .*?multipv (\d+) .*?score (cp|mate) (-?\d+).*? pv (\S+)/);
      if(m) best[m[1]] = [m[4], score(m[2], m[3])];
    }
    const out = Object.keys(best).sort((a, b2) => a - b2).map(k => best[k]);
    const bm = (got[got.length - 1] || '').split(' ')[1];
    if(!out.length && bm && bm !== '(none)') out.push([bm, 0]);
    return { lines: out, best: bm && bm !== '(none)' ? bm : null };
  }
  return {
    start, search,
    retry(){ if(failed){ failed = false; ready = null; busy = false; try{ w && w.terminate(); }catch(e){} w = null; } },
    get ok(){ return !failed && db.settings.sf !== false; },
    // ход бота: сила ограничена Эло (у Stockfish минимум 1320)
    async best(b, side, bot){
      try{ const r = await search(b, side, 'go movetime ' + (bot.sfTime || 800), 1, { elo: bot.sfElo }); return r.best; }
      catch(e){ return null; }
    },
    // оценка позиции за белых (для шкалы перевеса)
    async evalWhite(b, turn){
      const r = await search(b, turn, 'go movetime 300', 1);
      return r.lines.length ? r.lines[0][1] * turn : null;
    },
    // для разбора: лучшие ходы + сыгранный ход с оценками (как rootScores у встроенного движка)
    async analyze(b, side, played){
      const ms = genMoves(b, side);
      const r = await search(b, side, 'go depth 13 movetime 500', Math.min(2, ms.length));
      const list = [];
      for(const [n, sc] of r.lines){ const m = sfFind(ms, n); if(m && !list.some(x => x.m === m)) list.push({ m, sc }); }
      const pn = notation(played);
      if(!list.some(x => notation(x.m) === pn)){
        const pm = ms.find(x => notation(x) === pn) || played, nb = applyMove(b, pm);
        let sc;
        if(!genMoves(nb, -side).length) sc = cInCheck(nb, -side) ? WIN - 1 : 0;
        else { const r2 = await search(nb, -side, 'go depth 12 movetime 320', 1); sc = r2.lines.length ? -r2.lines[0][1] : 0; }
        list.push({ m: pm, sc });
      }
      return list.sort((x, y) => y.sc - x.sc);
    }
  };
})();
